function flash(color = 0x9fe8ff) {
  const f = document.getElementById('flash');
  f.style.background = '#' + color.toString(16).padStart(6, '0');
  f.style.opacity = '0.5';
  setTimeout(() => { f.style.opacity = '0'; }, 60);
}

// ===========================================================================
// 16) BAŞLAT
// ===========================================================================
// AI'A NOT: DEMO/TEST KANCASI. Tek bir sentetik tuş basımı (down+up) tek render karesinde olup
// bittiği için fizik motoru tuşu "basılı" göremez; bu yüzden tarayıcıdan klavye etkileşimini
// OTOMATİK doğrulamak mümkün değildir. 'demo=1' içeren URL ile gemi 1.2 sn sonra 2.2 sn kendini
// iter. Doğrulama ölçümü: spawn (420,-180) → (542,-302), hız uyarısı 0.
// NOT: Hermes preview paneli yerel dosya yoluna ?/# eklenince sayfayı bulamıyor → gerçek
// tarayıcıda denenmeli. Üretimde parametre yoksa ETKİSİZDİR.
const DEMO = location.href.includes('demo=1');
if (DEMO) {
  // AI'A NOT: M2 DEMO — en yakın kayaya YÖNEL, yaklaşınca dur, ateş et, kır, ganimeti al.
  // Yön/itkiş tuşlarla verilir (gemi burnu hız yönüne döner → ateş ışını kayaya bakar).
  // Amaç: madencilik zincirinin GÖRSEL olarak (ekran görüntüsü + probe) doğrulanması.
  let target = null;
  // M2e: İLK FAZ (5 sn) — YILDIZA YAKLAŞ. Kullanıcı isteği "yıldız geminin arkasında görünsün"
  // Z-SIRASI değişikliği bu fazda EKRAN GÖRÜNTÜSÜYLE doğrulanır: gemi yıldızın ÜSTÜNDE görünür.
  const DEMO_T0 = performance.now();
  const aim = setInterval(() => {
    if (performance.now() - DEMO_T0 < 5000) {
      const sx = 0 - state.me.x, sy = 0 - state.me.y;
      keys.KeyW = sy < -12; keys.KeyS = sy > 12;
      keys.KeyA = sx < -12; keys.KeyD = sx > 12;
      return;
    }
    if (!rocks.size || state.mapOpen) return;
    if (!target || !rocks.has(target)) {
      let bd = Infinity; target = null;
      for (const [id, r] of rocks) {
        const d = Math.hypot(r.g.x - state.me.x, r.g.y - state.me.y);
        if (d < bd) { bd = d; target = id; }
      }
    }
    const r = rocks.get(target);
    if (!r) return;
    // M2e: DEMO NİŞANI — "mouse ile basılan yere ateş" yolunu da doğrulanabilir kılar: nişan
    // hedefe kilitlenir → hem nişangâh çizilir hem SPACE atışı o yöne gider (ekran görüntüsü +
    // probe `nisan=` alanı ile kontrol edilir).
    state.aim = { x: r.g.x, y: r.g.y };
    const dx = r.g.x - state.me.x, dy = r.g.y - state.me.y;
    const d = Math.hypot(dx, dy) || 1;
    // AI'A NOT: Gemi burun yönünü HIZDAN alır (Asteroids tarzı): dururken bakış donar. Bu
    // yüzden "yaklaştım" yetmez, hedefe BAKIYOR olmak gerekir. Nişan hatası büyükse kısa
    // itişle dönmeye devam et; hem dönüş hem yaklaşma aynı itişle olur.
    const dot = Math.sin(state.me.r) * (dx / d) + (-Math.cos(state.me.r)) * (dy / d);
    const aligned = dot > 0.98;
    if (d < 260 && aligned) { keys.KeyW = keys.KeyA = keys.KeyS = keys.KeyD = false; return; }
    keys.KeyD = dx > 20; keys.KeyA = dx < -20;
    keys.KeyS = dy > 20; keys.KeyW = dy < -20;
  }, 150);
  setTimeout(() => { keys.Space = true; setStatus('demo: ates acik'); }, 900);
  setTimeout(() => { toggleTractor(); }, 12_000);
  setTimeout(() => { clearInterval(aim); keys.Space = false; setStatus('demo: bitti'); }, 22_000);
}
// AI'A NOT: MENÜ TEST KANCASI (yalnız '?menu=1'). Hermes önizleme paneli canvas oyuna TUŞ
// GÖNDEREMEZ; menünün (dil düğmeleri + kaydırmalı ses) görsel doğrulaması için 1.5 sn sonra
// açılır, 12 sn sonra kapanır. Parametresiz üretimde ETKİSİZDİR.
if (location.href.includes('menu=1')) {
  setTimeout(() => { toggleMenu(true); setStatus('menu: open'); }, 1500);
  setTimeout(() => { toggleMenu(false); setStatus('menu: closed'); }, 12_000);
}
// AI'A NOT: M2h GÖRSEL TEST KANCASI (yalnız '?m2h=1'). Önizleme paneli canvas'a tuş/tıklama
// gönderemediği için tarama dalgası + kilit çerçevesi + zanaat panelini GERÇEK kod yollarıyla
// açar (doScan / toggleLock / toggleCraft) → ekran görüntüsüyle doğrulanabilir. Parametresiz
// üretimde ETKİSİZDİR. (M2i: `?warp=<id>` ve `?hunt=1` kancaları da bu blokta kurulur.)
if (/(\?|&)(m2h=[123]|warp=\d+|hunt=1|refuel=1|anom=1|keyseq=\d+)/.test(location.href)) {
  setTimeout(() => {
    // M3f (`?refuel=1`): dolum akışını GÖRSEL doğrulamak için otomatik başlatır. Önizleme paneli
    // canvas'a tuş gönderemiyor; "Y'ye bastım ama yakıt artmıyor" şikayeti bu kancayla ekrandan
    // okunabilir hale gelir (sunucu menzil/depo kapılarını yine kendi uygular). Üretimde etkisiz.
    if (/(\?|&)refuel=1/.test(location.href)) setTimeout(() => startRefuel(), 1200);
    // M4a (`?anom=1`): anomali frekans girişini GÖRSEL doğrulamak için otomatik açar (`refuel=1`
    // ile aynı gerekçe: önizleme paneli canvas'a tuş gönderemiyor). Menzil dışıysak istemci kutu
    // açmaz, sunucu da reddeder. Sunucuyu `TEST_ANOM_NEAR=1` ile başlatmak doğuşu anomalinin
    // yanına taşır (bkz. rooms.js connect) — görsel doğrulama bu ikiliyle yapılır.
    if (/(\?|&)anom=1/.test(location.href)) setTimeout(() => openAnomalyInput(true), 1500);
    // M4a (`?keyseq=<rakamlar>`): Önizleme paneli canvas'a GERÇEK tuş gönderemiyor (tıklanabilir
    // eleman yok). Bu kanca GERÇEK `keydown` yolunu sentetik KeyboardEvent ile sürer — yani tuş
    // işleyicisi, kod toplama ve ENTER ile gönderme YOLU test edilir (kutuyu doğrudan doldurmak
    // yerine). Sunucu kapısı yine çalışır: kod yanlışsa gerçek `anom_wrong` cevabı gelir.
    if (/(\?|&)keyseq=\d+/.test(location.href)) {
      const seq = location.href.match(/keyseq=(\d+)/)[1];
      setTimeout(() => {
        for (const d of seq) {
          window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Digit' + d, bubbles: true }));
        }
        window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Enter', bubbles: true }));
      }, 2800);
    }
    // m2h'ye ÖZEL kısım ayrıca korunur: warp/hunt kancaları da bu blokta yaşar (tek yerden
    // kurulur) ama m2h'nin tarama/kilit davranışını istemsizce açmamalı.
    if (/(\?|&)m2h=[123]/.test(location.href)) {
      doScan();
      const near = roomObjects().filter((o) => o.kind === 'rock')
        .sort((a, b) => Math.hypot(a.x - state.me.x, a.y - state.me.y) - Math.hypot(b.x - state.me.x, b.y - state.me.y))[0];
      if (near) { state.aim = { x: near.x, y: near.y }; toggleLock(); }
      if (location.href.includes('m2h=2')) toggleCraft(true);
    }
    // `?warp=<starId>`: TEK SEFERLİK warp (görsel/davranış testi). Sunucu deterministik
    // galaksiyi doğrular; bu kanca yalnız "korsan sistemine git" adımını otomatikleştirir.
    if (!window.__warped && /(\?|&)warp=\d+/.test(location.href)) {
      window.__warped = 1;
      const m = location.href.match(/warp=(\d+)/);
      setTimeout(() => send({ t: 'warp', starId: Number(m[1]) }), 900);
    }
    // `?hunt=1`: en yakın KORSANA (yoksa korsan İSTASYONUNA) kilitlenip peşine düş (test kancası).
    if (/(\?|&)hunt=1/.test(location.href) && !window.__hunt) {
      window.__hunt = 1;
      // `peace=1`: ateş ETMEZ (yalnız yaklaşır) + önce İSTASYONU hedefler → istasyonun görsel
      // doğrulaması için (yoksa hook onu yıkıp ekrandan siliyor, ekran görüntüsü alınamıyor).
      const peace = /(\?|&)peace=1/.test(location.href);
      setInterval(() => {
        const L = state.lock;
        if (!L) {
          const ships = [...remotes.entries()].filter(([, o]) => o.pirate && o.group)
            .map(([id, o]) => ({ kind: 'ship', id, x: o.group.x, y: o.group.y }));
          const st = state.station ? [{ kind: 'station', id: state.station.id || 'st1', x: state.station.x, y: state.station.y }] : [];
          const order = peace ? [...st, ...ships] : [...ships, ...st];
          const tgt = order[0];
          if (tgt) { state.aim = { x: tgt.x, y: tgt.y }; toggleLock(); }
          else {
            const n2 = roomObjects().filter((o) => o.kind === 'rock')
              .sort((a, b) => Math.hypot(a.x - state.me.x, a.y - state.me.y) - Math.hypot(b.x - state.me.x, b.y - state.me.y))[0];
            if (n2) { state.aim = { x: n2.x, y: n2.y }; toggleLock(); }
          }
          return;
        }
        const p = objPos(L.kind, L.id);
        if (!p) return;
        const dx = p.x - state.me.x, dy = p.y - state.me.y, d = Math.hypot(dx, dy);
        if (d > (peace ? 70 : 300)) {
          keys.KeyW = dy < -12; keys.KeyS = dy > 12; keys.KeyA = dx < -12; keys.KeyD = dx > 12;
        } else {
          keys.KeyW = keys.KeyS = keys.KeyA = keys.KeyD = false;
          if (!peace) tryFire(performance.now());
        }
      }, 300);
    }
    if (location.href.includes('m2h=3')) {
      setInterval(() => {
        const L = state.lock;
        if (!L) {
          const n2 = roomObjects().filter((o) => o.kind === 'rock')
            .sort((a, b) => Math.hypot(a.x - state.me.x, a.y - state.me.y) - Math.hypot(b.x - state.me.x, b.y - state.me.y))[0];
          if (n2) { state.aim = { x: n2.x, y: n2.y }; toggleLock(); }
          return;
        }
        const p = objPos(L.kind, L.id);
        if (!p) return;
        const dx = p.x - state.me.x, dy = p.y - state.me.y, d = Math.hypot(dx, dy);
        // Yaklaş (kayaya doğru itki) → menzile girince DUR ve kilitliyken ATEŞ et.
        if (d > 240) {
          keys.KeyW = dy < -12; keys.KeyS = dy > 12; keys.KeyA = dx < -12; keys.KeyD = dx > 12;
        } else {
          keys.KeyW = keys.KeyS = keys.KeyA = keys.KeyD = false;
          tryFire(performance.now());
        }
      }, 300);
    }
    // Dalga 1.2 sn sürer; ekran görüntüsü zamanlaması rastgele olduğu için tekrar tetiklenir
    // (soğuma zaten 3 sn → sunucu/istemci kuralı bozulmaz, yalnız görünür kalır).
    setInterval(() => {
      if (state.craftOpen) return;
      state.scanReadyAt = 0; doScan();
      // Görsel testte halka EKRANDA kalsın diye menzil küçültülür (yoksa 1.2 sn'lik dalga çoğu
      // karede ekranın dışına çıkmış olur ve ekran görüntüsünde hiç görünmez).
      if (state.scan) state.scan.range = Math.round(Math.max(VW, VH) * 0.85);
    }, 900);
    setStatus('m2h: scan+lock');
  }, 1600);
}
// AI'A NOT: AYAR KANCALARI (yalnız URL ile). Menüye TIKLAMAK (dil düğmesi, ses kaydırıcısı) fare
// koordinatı gerektirir ve önizleme paneli bunu gönderemez → ayarlar URL'den de kurulabilir:
//   ?lang=tr          → dili Türkçe yap (İngilizce varsayılan)
//   ?vol=35           → ses seviyesi %35
// Parametresiz üretimde ETKİSİZDİR; ayarlar localStorage'da kalıcıdır.
{
  const m = location.href.match(/[?&]lang=(en|tr)/);
  if (m) setLang(m[1]);
  const v = location.href.match(/[?&]vol=(\d{1,3})/);
  if (v) setVolume(Number(v[1]) / 100);
}
// AI'A NOT: PROBE KANCASI (yalnız test). Canvas HUD'u dış araçlarla OKUNAMAZ; bu yüzden
// durum her 200ms'de DOM'a (#status) yazılır. Böylece harita modunun "harita kayar, gemi
// donar" davranışı ve yakıt tüketimi gerçek tarayıcıda SAYIYLA doğrulanabilir.
// Parametre yoksa etkisiz.
if (location.href.includes('probe=1')) {
  setInterval(() => {
    setStatus(`probe SURUM=${SURUM} me=(${Math.round(state.me.x)},${Math.round(state.me.y)}) ` +
      `map=${state.mapOpen ? 1 : 0} view=(${Math.round(state.mapView.x)},${Math.round(state.mapView.y)}) ` +
      `own=(${Math.round(state.mapOwn.x)},${Math.round(state.mapOwn.y)}) sec=${mapSelStar} star=${state.star ? state.star.n : 'yok'} ` +
      `yakit=${Math.round(state.fuel)}/${FUEL_TANK} kargo=${JSON.stringify(state.cargo)} kalkan=${Math.round(state.shield)} ` +
      `harita=${starmap ? starmap.count : 0}${mapStale ? '/BAYAT' : ''} sunucuHarita=${mapMeta ? mapMeta.count : '?'} ` +
      `fx=${fx.length} kaya=${rocks.size} kapsul=${pickups.size} ` +
      `nisan=${state.aim ? Math.round(Math.hypot(state.aim.x - state.me.x, state.aim.y - state.me.y)) : 'yok'} ` +
      `dolum=${state.refueling ? 1 : 0} starYakin=${Math.hypot(state.me.x, state.me.y) <= REFUEL_RANGE ? 1 : 0} ` +
      `tus=${keys.ArrowRight ? 'R' : ''}${keys.ArrowLeft ? 'L' : ''}${keys.ArrowUp ? 'U' : ''}` +
      `${keys.ArrowDown ? 'D' : ''}${keys.Space ? 'SP' : ''} ` +
      `ses=${sfx.ready() ? 'on' : 'off'} vol=${Math.round(VOLUME * 100)} muted=${state.muted ? 1 : 0} dil=${LANG} menu=${MENU.open ? 1 : 0} ` +
      `tarama=${state.scan ? 1 : 0} isaret=${state.scanMarks.length} beacon=${beaconActive() ? 1 : 0} ` +
      `kilit=${state.lock ? `${state.lock.kind}/${state.lock.id}` : 'yok'} boost=${state.boosting ? 1 : 0} zanaat=${state.craftOpen ? 1 : 0} ` +
      // M2i: korsanlar + istasyon (canlı testte bunlar okunur)
      `korsan=${[...remotes.values()].filter((o) => o.pirate).length} istasyon=${state.station ? state.station.hp : 0} ` +
      // M4a: ANOMALİ durumu — istemcinin sunucudan ne aldığını ve kod girişinin gerçekten
      // çalıştığını SAYIYLA okumak için (canvas HUD'u dış araçlarca okunamaz).
      `anom=${state.anom ? `${state.anom.kind}/${state.anom.signal ? 'S' : 'K'}/hp=${state.anom.hp}-${state.anom.max}${state.anom.solved ? '/COZULDU' : ''}` : 'yok'} ` +
      `anomMesafe=${state.anom ? Math.round(Math.hypot(state.anom.x - state.me.x, state.anom.y - state.me.y)) : -1} ` +
      `ipucu=${state.anomHint || 'yok'} kodGiris=${state.anomInputOpen ? 1 : 0} buf=${state.anomBuf || '-'} anomTus=${window.__anomKeys || '-'} ` +
      `sonLog=${state.log.slice(-3).map((e) => e.text.slice(0, 30)).join(' | ') || '-'} yanlisDeneme=${state.log.filter((e) => /mismatch|uyusmadi/i.test(e.text)).length} kodGonderme=${window.__solveTry || '-'} logN=${state.log.length} ` +
      (window.__selftest ? `SELFTEST[${window.__selftest}] ` : '') +
      `gelen=${window.__rx || '-'} ` +
      `tk=${window.__tk || 0} son=${window.__tkEnd || 0} hata=${lastErr || 'yok'}`);
  }, 200);
}
// AI'A NOT: MENÜ ÖZ-TESTİ (yalnız '?probe=1&selftest=1'). Önizleme paneli canvas'a NE TIKLAMA
// NE TUŞ gönderebiliyor; bu yüzden menünün GERÇEK tıklama yolunu (isabet testi → setLang /
// setVolume / toggleMute) doğrudan çağırıp sonucu DOM'a yazar. Üretimde ve normal probe'da
// ÇALIŞMAZ. Tetikleyici değil DAVRANIŞ test edilir.
if (PROBE && location.href.includes('selftest=1')) {
  setTimeout(() => {
    const out = [];
    const orta = (r) => [Math.round(r.x + r.w / 2), Math.round(r.y + r.h / 2)];
    toggleMenu(true); menuLayout();
    out.push(`menu=${MENU.open ? 1 : 0}`);
    menuHitClick(...orta(MENU.tr)); out.push(`tr=${LANG}`);
    menuHitClick(...orta(MENU.en)); out.push(`en=${LANG}`);
    const m0 = state.muted;
    menuHitClick(...orta(MENU.mute)); out.push(`mute=${m0 ? 1 : 0}->${state.muted ? 1 : 0}`);
    menuHitClick(...orta(MENU.mute));                       // eski hâle getir
    volumeFromX(MENU.track.x + MENU.track.w * 0.25); out.push(`vol=${Math.round(VOLUME * 100)}`);
    setVolume(0.8);
    const p0 = MENU.open;
    menuHitClick(MENU.btn.x + 2, MENU.btn.y + 2); out.push(`btn1=${MENU.open === p0 ? 'DEGISMEDI' : (MENU.open ? 'AC' : 'KAPA')}`);
    menuHitClick(MENU.btn.x + 2, MENU.btn.y + 2); out.push(`btn2=${MENU.open ? 'AC' : 'KAPA'}`);
    toggleMenu(false);
    // --- M3b: BİRLEŞİK PANEL — envanter (eşya kullan) + zanaat (üret) AYNI panelde ---
    toggleCraft(true); craftLayout();
    state.cargo.REPAIRKIT = 1;              // elle şişir: tıklama yolunu kanıtlamak için
    drawCraft();                            // tıklama kutularını GERÇEK çizim yolu kurar
    out.push(`panel=${state.craftOpen ? 1 : 0} envanter=${CRAFT.invRows.length}satir tarif=${CRAFT.rows.length}satir`);
    // Geometri teşhisi: metin genişlikleri ile sütun genişliği karşılaştırılabilir olsun.
    out.push(`geo VW=${VW} pan=${Math.round(CRAFT.panel.w)}x${Math.round(CRAFT.panel.h)} colW=${CRAFT.colW} `
      + `ad=${Math.round(cRows[3].name.width)} maliyet=${Math.round(cRows[3].cost.width)} dipnot=${Math.round(cFoot.width)}`);
    const row = (CRAFT.invRows || []).find((r) => r.id === 'REPAIRKIT');
    if (row) {
      const rc = app.canvas.getBoundingClientRect();
      const cx = (row.x + row.w / 2) * SCALE + rc.left, cy = (row.y + row.h / 2) * SCALE + rc.top;
      window.__lastUse = null;
      app.canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: cx, clientY: cy, button: 0, bubbles: true }));
      out.push(`esya_satiri=${(state.invHits || []).length}cip tik=${window.__lastUse || 'ULASMADI'}`);
    } else out.push('esya_satiri=yok');
    const r0 = CRAFT.rows[0];
    craftHitClick(r0.x + 6, r0.y + 6);      // 1. tarif: WARPCELL (üretim yolu; doğuşta DOTERYUM yok →
                                            // bu istek `craft_fail` döner, tıklama yolu yine kanıtlanır)
    out.push('tarif_tik=OK');
    toggleCraft(false);
    drawCraft();                            // panel kapalıyken kutu KALMAMALI
    out.push(`kapali_kutu=${(state.invHits || []).length}`);
    // --- M3c: DOLUM = YILDIZDAN ÇEKME (malzeme dönüşümü YOK). Sözlükte "convert/DOTERYUM" izi
    // kalmadığını ve ipucunun yeni metni verdiğini KANITLA (uydurma mekaniğin geri gelme bekçisi).
    out.push(`dolum_ipucu="${t('ui_refuel_hint')}" `
      + `refuel_none_yok=${!(('refuel_none' in (STR[LANG] || {})) || ('refuel_none' in STR.en))} `
      + `yakitsiz_uyari="${t('fuel_empty_warn')}"`);
    doScan();
    out.push(`tarama=${state.scan ? 1 : 0}/${state.scanMarks.length}`);
    const near = roomObjects().filter((o) => o.kind === 'rock')
      .sort((a, b) => Math.hypot(a.x - state.me.x, a.y - state.me.y) - Math.hypot(b.x - state.me.x, b.y - state.me.y))[0];
    if (near) {
      state.aim = { x: near.x, y: near.y };
      toggleLock();
      out.push(`kilit=${state.lock ? `${state.lock.kind}/${state.lock.id}` : 'yok'}`);
      updateLock();
      out.push(`nisan=${state.aim ? (Math.round(Math.hypot(state.aim.x - near.x, state.aim.y - near.y)) <= 2 ? 'hedefte' : 'kaydi') : 'yok'}`);
    }
    // --- M3: SOHBET — kanal döngüsü + hedefsiz özel mesaj kapısı + @isim ayrıştırma. Önizleme
    // paneli tuş üretemez → fonksiyonlar doğrudan çağrılır, sonuç DOM rozetinden okunur.
    {
      const seen = [];
      for (let i = 0; i < CHAT_CH.length; i++) {
        chatCh = CHAT_CH[(CHAT_CH.indexOf(chatCh) + 1) % CHAT_CH.length];
        chatUI();
        seen.push((chatwf ? chatwf.textContent : '?').split(' ')[0]);
      }
      out.push(`sohbet=${seen.join('/')}`);
      chatCh = 'p'; dmTo = ''; chatUI();
      const before = state.log.length;
      sendChat('hedefsiz');                     // özel + hedef yok → YEREL uyarı, ağa çıkmaz
      out.push(`ozel_hedefsiz=${state.log.length > before ? 'uyari' : 'SESSIZ'}`);
      sendChat('@HEDEF123 deneme');             // @isim → dmTo dolar (gönderim yolu çalışır)
      out.push(`dm_hedef=${dmTo || 'yok'}`);
      chatCh = 'l'; dmTo = ''; chatUI();
    }
    window.__selftest = out.join(' ');
  }, 1500);
}
// AI'A NOT: SOHBET GÖRSEL KANCA (?chat=1). Önizleme paneli YAZI YAZAMAZ → giriş kutusu kanal
// rozetiyle açılır ve örnek kanal mesajları log'a basılır; ayrıca kutuya örnek bir DM yazısı
// konur. Görsel doğrulama (ekran görüntüsü) bu kancayla yapılır, üretimde etkisizdir.
if (/(\?|&)chat=1/.test(location.href)) {
  setTimeout(() => {
    const ch = (/(\?|&)ch=([gspl])(&|$)/.exec(location.href) || [])[2];
    if (ch) chatCh = ch;
    chatShow(true);
    if (ch === 'p') dmTo = 'HEDEF123';          // özel kanal: hedef hatırlanmış gibi
    chatUI();
    logLine('[L] PROSPECTOR-4: yerel kanal mesaji', 'chat');
    logLine('[S] DRIFTER-K2: sektor kanali burada', 'chat');
    logLine('[G] OUTRIDER-9: global anons duyuldu', 'chat');
    logLine(`[P] ${t('chat_dm_from', { name: 'VAGRANT-1' })}: ozel mesaj`, 'chat');
    chatin.value = ch === 'p' ? 'gizli cevap' : 'merhaba dunya';
  }, 1400);
}
// AI'A NOT: HARİTA TEST KANCASI. Klavye gönderemeyen araçlarla (otomasyon/ekran görüntüsü)
// harita ekranını görebilmek için: URL 'map=1' içeriyorsa harita kendiliğinden açılır.
// Üretimde parametre yoksa ETKİSİZDİR (tek satırlık kontrol, yan etkisi yok).
if (location.href.includes('map=1')) {
  // AI'A NOT: PAN MODU testi: harita açılır ve ok tuşları KALICI basılı tutulur → bütün yıldız
  // alanı kayar. Probe'da `view` merkezden uzaklaşır, `own` (kendi yıldızımız) ve `me` SABİT
  // kalır. Yön 1.2 sn'de bir ters çevrilir: iki okuma arasında view DEĞİŞİR, own SABİT.
  setTimeout(() => {
    if (!state.mapOpen) toggleMap();
    let dir = 1;
    setInterval(() => {
      dir = -dir;
      keys.ArrowRight = dir > 0; keys.ArrowLeft = dir < 0;
      keys.ArrowDown = dir > 0; keys.ArrowUp = dir < 0;
    }, 1200);
    setStatus('test: harita PAN modu (yon 1.2 sn de bir ters)');
  }, 2500);
}

applyViewport();   // ölçek/yerleşim önce
applyLang();       // M2g: dil tercihini uygula (sohbet kutusu ipucu vb.)
setStatus(t('boot'));
connect();
loadMap();
</script>
