<!DOCTYPE html>
<!-- ==========================================================================
AI'A NOT: game-client/index.html — PUBLIC OYUN İSTEMCİSİ  (ART DIRECTION: ESKİ-USÜL PIXEL ART)
===========================================================================
GÖRSEL MİMARİ — dört kritik kural (her biri bir hatanın düzeltmesi):

 1) GERÇEK PİKSEL RENDER + EKRANI TAM KAPLAYAN TAM SAYI ÖLÇEK.
    Canvas'a "sanal çözünürlük" (örn 640x320) render edilir, CSS onu tam sayı katına
    büyütür. Sanal çözünürlük SABİT DEĞİL: `k = round(ekranYüksekliği / 280)` seçilip
    sanal boyut = ekran/k yapılır → canvas piksel-piksel ekranı kaplar, YANLARDA SİYAH
    BANT KALMAZ ve tüm pikseller AYNI boyutta olur.
    (Önceki hata: sabit 480x270 + floor() ölçek → 1920x960 ekranda 1440x810, yanlarda bant.)

 2) METİN BİTMAP FONT (PIXI.Text ASLA).
    Pixi'nin Text'i fontu yumuşak (antialiased) rasterize eder; 3-4x büyütülünce bulanık
    çıkar. Burada 5x7 harf matrisiyle çizilen GERÇEK bitmap font kullanılır: her glif
    piksel piksel bir offscreen canvas'a yazılır, canvas → doku (nearest) olarak sprite'a
    verilir. Sonuç: keskin, tırtıklı, dönem-doğru metin; üstelik satır başına TEK draw call.
    (Önceki hata: PIXI.Text → "yazılar bulanık".)

 3) KATMAN GÖRÜNÜRLÜĞÜ TEK YERDEN.
    Pixi Container.visible VARSAYILAN true'dur. Overlay (harita) katmanı bu yüzden
    başlatılmazsa ekranı kaplar ve toggle ters çalışır. Kural: katman kurulurken false,
    açık/kapalı durumu HER ZAMAN `state.mapOpen`dan uygulanır.

 4) TOGGLE TUŞLARINDA AUTO-REPEAT YOK SAYILIR.
    Tuşu basılı tutmak keydown'ı tekrarlar → harita açılıp anında kapanır ("harita
    açılmıyor" şikâyetinin gerçek sebebi). `e.repeat` kontrol edilir.

AĞ MODELİ (backend/src/protocol.js ile sözleşme):
  sn → odaya girişte tek büyük paket (asteroidler + diğer gemiler + yıldız) | du → 10Hz diff
  hb → sunucu aynı 'c' ile yanıtlar (gerçek RTT) | sys → sistem/sohbet mesajı | warp_ok
KONTROLLER: WASD = hareket, M = galaksi haritası (tıkla = warp), B = sohbet (TAB: kanal, @isim: özel), ESC = kapat
=========================================================================== -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroVector</title>
<style>
  /* AI'A NOT: Zemin siyah; canvas EKRANI TAM KAPLAR (JS boyutlandırır).
     image-rendering:pixelated → büyütme komşu-piksel (nearest), bulanıklık YOK. */
  html,body{margin:0;height:100%;width:100%;background:#02030a;overflow:hidden;
    font-family:monospace;-webkit-font-smoothing:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

  /* CRT hissi: tarama çizgileri + vinyet. Overlay olduğu için render maliyeti YOK.
     pointer-events:none → overlay tıklamayı engellemez (harita tıklaması için kritik). */
  #overlay{position:fixed;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.5) 100%);
    mix-blend-mode:multiply}
  #flash{position:fixed;inset:0;pointer-events:none;background:#9fe8ff;opacity:0;
    transition:opacity .45s ease-out}

  /* Sohbet girişi — B'ye basınca görünür. DOM çünkü gerçek klavye girişi gerekiyor;
     pixel HUD'un üstünde durur, bu yüzden koyu/keskin çerçeveli. */
  #chatin{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:none;
    background:#04060f;border:2px solid #1d3a4a;color:#8fe0ff;font:13px monospace;
    padding:5px 9px;width:420px;outline:none}
  /* M3: kanal rozeti + kısayol satırı (giriş kutusunun HEMEN üstünde) */
  #chatbar{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);display:none;
    width:420px;font:11px monospace;color:#4c7f96;justify-content:space-between;pointer-events:none}
  #chatbar b{color:#8fe0ff;font-weight:normal}

  /* Boot/runtime durum satırı — TEŞHİS kanalı: canvas içeriği metin olarak okunamaz,
     DOM metni okunabilir. Dışarıdan doğrulama bu satır sayesinde yapılır. */
  #status{position:fixed;bottom:3px;left:8px;color:#1e3a44;font:10px monospace;
    pointer-events:none;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status.err{color:#ff5a5a}
</style>
</head>

<script type="module">
// AI'A NOT: type="module" ZORUNLU — aşağıda top-level `await app.init(...)` var ve top-level

//
// Hata yakalama + durum satırı İLK İŞ: init adımlarından biri patlarsa (WebGL yok, CDN düştü)
// hata ekranda ve DOM'da okunur hale gelir.
const statusEl = document.getElementById('status');
const boot = [];
function setStatus(msg, isErr = false) {
  boot.push(msg);
  statusEl.textContent = boot.slice(-3).join(' | ');
  statusEl.classList.toggle('err', isErr);
}
let lastErr = null;   // PROBE: son hata — canvas HUD'u dış araçlarca okunamadığı için gerekli
addEventListener('error', (e) => {
  // AI'A NOT: Yalnız mesaj yetmiyor — çöken SATIR da gerekli (ticker içindeki bir throw tüm kareyi
  // öldürür ve oyun "donmuş" görünür). Stack'in ilk karesi #status'a yazılır.
  const loc = e.error && e.error.stack ? String(e.error.stack).split('\n')[1] : `${e.filename || ''}:${e.lineno || 0}`;
  lastErr = String(e.message || e.error) + ' @' + String(loc || '').trim().slice(0, 90);
  setStatus('HATA: ' + lastErr, true);
});
addEventListener('unhandledrejection', (e) => { lastErr = 'promise: ' + String((e.reason && e.reason.message) || e.reason); setStatus('HATA: ' + lastErr, true); });
setStatus('script calisti');

// AI'A NOT: Burada sabit `ws://localhost:8081` vardı. Bulutta bu iki şekilde kırılır:
//  (1) uzak oyuncunun tarayıcısı KENDİ localhost'una bağlanmaya çalışır → hiç bağlanamaz,
//  (2) yayın HTTPS ise tarayıcı `ws://` (şifresiz) bağlantıyı MIXED CONTENT diye BLOKLAR; `wss://` şart.
// Çözüm: adres SAYFANIN KENDİSİNDEN türetilir (aynı origin) — Caddy/nginx hem HTML'i hem WebSocket'i
// aynı domainden servis ettiği için CORS ve sertifika derdi kalmaz. Yerel geliştirme değişmez:
// http://localhost:8081 → ws://localhost:8081 (eskisiyle birebir aynı).
// Kaçış kapısı: `?ws=wss://ornek.com` (farklı bir sunucuya bağlanmak gerekirse) ve
//                `?ws=ws://localhost:8082` (ikinci yerel örnek — testler bunu kullanır).
function deriveWsUrl() {
  const override = new URLSearchParams(location.search).get('ws');
  if (override) return override.replace(/\/+$/, '');
  if (location.protocol === 'file:') return 'ws://localhost:8081';   // dosyadan açıldıysa (dev)
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  return proto + location.host;
}

// AI'A NOT: Türkçe karakterler ASCII karşılığına indirilir — bitmap fontta glif açmaya gerek
// kalmaz ve HUD tutarlı kalır (ş→S, ğ→G, ı→I, İ→I, ç→C, ö→O, ü→U).
// Noktalama da eşlenir: fontta olmayan bir karakter `?` olarak çizilir ve ekranda
// "BAGLANTI KURULDU ? SINYAL ARANIYOR" gibi bozuk metin çıkar (yaşandı). Bu yüzden
// tire/uzun çizgi/tırnak/elips gibi Unicode noktalama da buraya eklenir.
const TR_MAP = {
  'Ş':'S','ş':'s','Ğ':'G','ğ':'g','ı':'i','İ':'I','Ç':'C','ç':'c','Ö':'O','ö':'o','Ü':'U','ü':'u','Â':'A','â':'a','Î':'I','î':'i',
  '—':'-','–':'-','−':'-','…':'.','·':'·','•':'·','×':'x','’':"'",'‘':"'",'“':'"','”':'"','\u00a0':' ','\t':' ',
};
function glif(ch) {
  const c = TR_MAP[ch] ?? ch;
  return FONT[c.toUpperCase()] || FONT[c] || FONT['?'];
}

// --- BitmapText: metni offscreen canvas'a çizer, dokusunu sprite'a verir ---
// AI'A NOT: Canvas boyutu SABİT tutulur (maxW x maxH) ve her çizimde sadece içeriği yenilenir.
// Neden: Pixi v8'de canvas boyutunu değiştirmek texture.source.resize() gerektirir ve unutulursa
// kopuk/kesik metin çıkar. Sabit tuval bu sınıf hatayı tamamen ortadan kaldırır.
class BitmapText {
  constructor(maxW, maxH, color) {
    this.canvas = document.createElement('canvas');
    this.canvas.width = maxW; this.canvas.height = maxH;
    this.ctx = this.canvas.getContext('2d');
    this.color = color;
    this.texture = PIXI.Texture.from(this.canvas);
    this.texture.source.scaleMode = 'nearest';   // AI'A NOT: nearest ŞART, yoksa büyütmede blur
    this.sprite = new PIXI.Sprite(this.texture);
    this.last = null; this.lastColor = null;
  }
  // Metin/renk değişmediyse YENİDEN ÇİZMEZ (her karede HUD çizmek israfa döner).
  set(text, color) {
    const t = text ?? '';
    const c = color ?? this.color;
    if (t === this.last && c === this.lastColor) return this.sprite;
    this.last = t; this.lastColor = c;
    const { ctx, canvas } = this;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#' + c.toString(16).padStart(6, '0');
    const lines = t.split('\n');
    for (let li = 0; li < lines.length; li++) {
      const line = lines[li];
      const y0 = li * SATIR_Y;
      if (y0 + GLIF_Y > canvas.height) break;               // taşan satırı çizme (sessiz kırpma)
      for (let ci = 0; ci < line.length; ci++) {
        const x0 = ci * (GLIF_G + HARF_ARA);
        if (x0 + GLIF_G > canvas.width) break;
        const g = glif(line[ci]);
        for (let y = 0; y < GLIF_Y; y++) {
          const row = g[y];
          for (let x = 0; x < GLIF_G; x++) if (row[x] === '#') ctx.fillRect(x0 + x, y0 + y, 1, 1);
        }
      }
    }
    this.texture.source.update();
    // AI'A NOT: Çizilen metnin SANAL PİKSEL genişliği kaydedilir. Neden: tuval sabit
    // genişlikte olduğu için sprite'ı tuval genişliğine göre ortalamak YANLIŞ olur — kısa bir
    // metin ekranın soluna kayar ve kırpılır (yaşandı: fısıltı yazısı ekranın solunda
    // "…RA YAKIN." olarak görünüyordu). Ortalama HER ZAMAN bu ölçülen genişlikle yapılır.
    let maxW = 0;
    for (const line of lines) maxW = Math.max(maxW, line.length * (GLIF_G + HARF_ARA));
    this.width = maxW > 0 ? maxW - HARF_ARA : 0;
    return this.sprite;
  }
}

// ===========================================================================
// 3) PIXEL SPRITE ÜRETİCİ (gemi/asteroit)
// ===========================================================================
// AI'A NOT: Sprite'lar harici görsel değil, koddaki harf matrisleri. Tek dosya, sıfır asset,
// piksel-piksel kontrol; renk değişimi tek palette takasıyla (kendi gemisi / uzak gemi).
function pixelSprite(rows, palette) {
  const g = new PIXI.Graphics();
  const h = rows.length, w = rows[0].length;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const col = palette[rows[y][x]];
      if (col == null) continue;                    // '.' → şeffaf
      g.rect(x - w / 2, y - h / 2, 1, 1).fill(col);  // merkez etrafında hizala → dönüş doğru
    }
  }
  return g;
}

// --- Görüntü alanı: ekranı TAM kaplayan tam sayı ölçek (bkz. dosya başı kural 1) ---
function applyViewport() {
  const W = Math.max(320, innerWidth), H = Math.max(200, innerHeight);
  // 1) TERCİH EDİLEN: ekranı tam kapla. Sanal yükseklik ~HEDEF_SATIR_YUKSEKLIGI →
  //    glif ölçeği okunaklı kalır ve piksel boyutu her yerde AYNI olur (yanlarda siyah bant yok).
  SCALE = Math.max(1, Math.round(H / HEDEF_SATIR_YUKSEKLIGI));
  VW = Math.ceil(W / SCALE); VH = Math.ceil(H / SCALE);
  // 2) AŞIRI DAR/DİKEY pencere (örn. dar bir panel): sanal genişlik 340'ın altına düşerse HUD
  //    (radar + log + üst bilgi) üst üste biner. Bu durumda letterbox'a düşülür: ölçek
  //    genişlikten türetilir ve 16:9 korunur, dikeyde siyah bant kabul edilir.
  //    Normal tarayıcı penceresinde bu dal HİÇ çalışmaz.
  if (VW < 340) {
    SCALE = Math.max(1, Math.floor(W / 480));
    VW = Math.floor(W / SCALE);
    VH = Math.round(VW * 9 / 16);
  }
  app.renderer.resize(VW, VH);
  app.canvas.style.width = VW * SCALE + 'px';
  app.canvas.style.height = VH * SCALE + 'px';
  world.position.set(Math.round(VW / 2 - state.cam.x), Math.round(VH / 2 - state.cam.y));
  layout();     // HUD/harita yerleşimi sanal boyuta bağlı → yeniden kur
  if (starmap) buildMap();
}

// 5) ARKA PLAN: NEBULA + PARALLAX YILDIZLAR (gizem atmosferi)
// ===========================================================================
// AI'A NOT: Sabit seed'li PRNG → her yüklemede AYNI gökyüzü (deterministik dünya kuralı).
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

const nebulaLayers = [];
for (let layer = 0; layer < 3; layer++) {
  const c = new PIXI.Container();
  const g = new PIXI.Graphics();
  const r = mulberry32(900 + layer * 77);
  const cols = [P.nebA, P.nebB, P.nebC, P.nebD];
  for (let i = 0; i < 26 - layer * 6; i++) {
    const col = cols[Math.floor(r() * cols.length)];
    g.circle((r() - 0.5) * 3600, (r() - 0.5) * 3000, 60 + r() * 170)
      .fill({ color: col, alpha: 0.05 + r() * 0.07 });   // üst üste binince organik "duman"
  }
  g.blendMode = 'add';
  c.addChild(g);
  c._parallax = 0.06 + layer * 0.06;
  camLayer.addChild(c);
  nebulaLayers.push(c);
}

const starLayers = [];
for (let layer = 0; layer < 3; layer++) {
  const g = new PIXI.Graphics();
  const r = mulberry32(4242 + layer);
  for (let i = 0; i < 130 - layer * 25; i++) {
    const s = layer === 2 && r() < 0.3 ? 2 : 1;   // yakın katmanda 2px "büyük" yıldızlar
    g.rect((r() - 0.5) * 4200, (r() - 0.5) * 3600, s, s)
      .fill({ color: 0xffffff, alpha: Math.min(0.25 + layer * 0.28 + r() * 0.2, 1) });
  }
  g._parallax = 0.12 + layer * 0.18;
  camLayer.addChild(g);
  starLayers.push(g);
}

// Tek tek parıldayan yıldızlar (nadir, 26 nesne → ucuz)
const twinklers = [];
{
  const r = mulberry32(777);
  for (let i = 0; i < 26; i++) {
    const g = new PIXI.Graphics();
    const col = P.starC[Math.floor(r() * 7)];
    const size = r() < 0.2 ? 3 : 2;
    g.rect(0, 0, size, size).fill(col);
    if (size === 3) g.rect(-2, 1, 1, 1).fill({ color: col, alpha: 0.6 });  // haç parıltısı
    g._px = (r() - 0.5) * 4000; g._py = (r() - 0.5) * 3400;
    g._phase = r() * Math.PI * 2; g._speed = 0.6 + r() * 1.6;
    camLayer.addChild(g); twinklers.push(g);
  }
}

function drawAim() {
  aimG.clear();
  if (!state.aim || state.mapOpen || chatOpen) return;
  const ax = Math.round(state.aim.x), ay = Math.round(state.aim.y);
  const d = Math.hypot(ax - state.me.x, ay - state.me.y);
  if (d < 8) return;
  const col = d <= FIRE_RANGE ? 0x8ff0ff : 0x3a6a80;
  aimG.moveTo(state.me.x, state.me.y).lineTo(ax, ay).stroke({ width: 1, color: col, alpha: 0.16 });
  aimG.rect(ax - 3, ay - 1, 7, 2).fill({ color: col, alpha: 0.5 });
  aimG.rect(ax - 1, ay - 3, 2, 7).fill({ color: col, alpha: 0.5 });
}

const announced = new Set();   // "sistemde belirdi" anonsu tekrarı (aynı çağrı işareti ikinci kez yazılmaz)
let ws = null, ping = 0, frames = 0, hbSeq = 0, hbSentAt = 0, lastDt = 0, lastHbAck = performance.now();
const keys = {};

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { logLine(t('ws_connected')); setStatus(t('ws_ok')); logLine(`SURUM ${SURUM}`); };
  ws.onclose = () => { logLine(t('ws_lost_retry')); setTimeout(connect, 2500); };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => handle(JSON.parse(e.data));

  // AI'A NOT: HEARTBEAT 5 sn'de bir; sunucu aynı 'c' ile yanıtlar → GERÇEK RTT.
  // Bu timer setInterval'dır, requestAnimationFrame DEĞİL: sekme arka plana düşünce rAF durur
  // (oyun döngüsü susar) ama bağlantı CANLI kalmalı. Aksi halde gizli sekme sürekli yeniden
  // bağlanır ve sunucuda hayalet oyuncu birikir.
  setInterval(() => {
    hbSentAt = performance.now();
    send({ t: 'hb', c: ++hbSeq });
    if (performance.now() - lastHbAck > 25000) { logLine(t('ws_lost_reconnect')); ws.close(); }
  }, 5000);

  // Teşhis satırı (DOM) — dışarıdan doğrulama kanalı (bkz. dosya başı #status notu).
  setInterval(() => {
    const map = `harita ${state.mapOpen ? 'ACIK' : 'kapali'}/${mapLayer.visible ? 'gorunur' : 'gizli'}`;
    if (DEMO) {
      const down = Object.keys(keys).filter(k => keys[k]).join(',') || '-';
      setStatus(`kare ${frames} | scroll ${SCROLL} | dt ${lastDt.toFixed(3)} | vx ${state.me.vx.toFixed(0)} | tus ${down} | ping ${ping}ms`);
    } else {
      setStatus(`ping ${ping}ms | ${remotes.size} temas | ${rocks.size} kaya | ${map} | ${VW}x${VH}@${SCALE}x`);
    }
  }, 2000);
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function handle(m) {
  if (PROBE) window.__rx = ((window.__rx || '') + (m.t === 'sys' ? 'sys:' + m.code : m.t) + ';').slice(-130);   // TEST: son ~8 gelen paket
  switch (m.t) {
    // --- SNAPSHOT: sisteme giriş. Uzak nesneleri SIFIRLA (yoksa warp sonrası hayalet kalır). ---
    case 'sn': {
      state.roomId = m.roomId; state.you = m.you; state.star = m.star;
      state.callsign = m.cs || state.callsign;    // M3: kendi çağrı işaretin (özel mesaj hedefi)
      // AI'A NOT: Menzil sunucudan gelir; client sabit gömmez (iki taraf ayrışamaz).
      if (Number.isFinite(m.jumpRange)) JUMP_RANGE = m.jumpRange;
      // M2h: tarifeler + eşya adları + boost çarpanları SUNUCUDAN gelir (tek gerçek kaynak).
      if (Array.isArray(m.recipes) && m.recipes.length) RECIPES = m.recipes;
      if (m.items) ITEMS = m.items;
      if (m.boost) {
        if (Number.isFinite(m.boost.mul)) BOOST_MUL = m.boost.mul;
        if (Number.isFinite(m.boost.fuel)) BOOST_FUEL_MUL = m.boost.fuel;
      }
      state.cargo = m.cargo || {};      // M2: envanter sunucudan gelir (yeniden bağlanmada da)
      state.tractorOn = false;
      if (Number.isFinite(m.shield)) state.shield = m.shield;   // M2: can/kalkan sunucudan
      if (Number.isFinite(m.hull)) state.hull = m.hull;
      if (Number.isFinite(m.fuel)) state.fuel = m.fuel;         // M2b: yakıt sunucudan
      state.me.x = m.x; state.me.y = m.y;
      state.serverPos.x = m.x; state.serverPos.y = m.y;
      state.cam.x = m.x; state.cam.y = m.y;
      state.me.vx = state.me.vy = 0;
      SCROLL = 0;   // yeni sisteme temiz giriş

      for (const [, o] of remotes) o.group.destroy({ children: true });
      remotes.clear(); announced.clear();
      // M2e: yeni sisteme girişte düşen kapsüller sıfırlanır; sunucu snapshot'ı yeniden kurar.
      for (const [, pk] of pickups) pk.group.destroy({ children: true });
      pickups.clear();
      for (const k of (m.pickups || [])) addPickup(k[0], k[1], k[2], k[3], k[4]);
      // M4a: anomali de snapshot'tan kurulur (yoksa `null` → eski nesne temizlenir)
      syncAnomaly(m.anom || null);
      // M2i: KORSAN DÜNYASI — korsan gemileri + istasyon snapshot'tan kurulur.
      state.pirateLvl = m.pirateLvl || 0;
      setStation(m.station || null);
      for (const n of (m.npcs || [])) upsertRemote(n[0], n[1], n[2], n[3], n[4], true);
      for (const [, r] of rocks) r.g.destroy({ children: true });
      rocks.clear();
      buildStar(m.star);
      for (const [id, x, y, size, hp, ore] of m.rocks || []) addRock(id, x, y, size, hp, ore);
      for (const [id, x, y, r, callsign] of m.players || []) upsertRemote(id, x, y, r, callsign);

      logLine(t('entered_system', { star: m.star ? m.star.n : t('unknown_system'), rocks: (m.rocks || []).length, contacts: (m.players || []).length }));
      // AI'A NOT: Sisteme varış = keşif. Yeni yıldızlar açılırsa harita yeniden çizilir,
      // böylece M'ye basıldığında güncel keşif durumu görünür.
      // AI'A NOT: HARİTA SÜRÜM KONTROLÜ. Sunucu hangi galakside olduğumuzu söyler; elimizdeki
      // harita farklıysa kendi yıldızımızın konumu bulunamaz → harita merkezlenmez, "SEN" işareti
      // çizilmez, warp tutmaz ("harita bozuk" belirtisinin kök nedeni: bayat tarayıcı cache'i).
      if (m.map) mapMeta = m.map;
      if (starmap && !mapMatches()) refreshStaleMap();
      const before = starmap ? seen.size : 0;
      markSeen(m.star ? m.star.i : null);
      if (starmap && (seen.size !== before || state.mapOpen)) buildMap();
      if (m.star && m.star.a) whisper(anomalyText(m.star.a), true);
      else whisper(pick([t('w_drift'), t('w_dust'), t('w_engine')]));
      break;
    }

    // --- DIFF: 10Hz konum güncellemeleri ---
    case 'du': {
      for (const [id, x, y, r, flags] of m.d) {
        if (flags === 'X') { removeRemote(id); continue; }
        if (id === state.you) {
          // AI'A NOT: KENDİ GEMİMİZİN DOĞRULAMASI. Client önizleme yapar; sunucu kısıtlarsa
          // (hız clamp / teleport) hedef burada güncellenir, gövde yumuşakça yakınsar.
          state.serverPos.x = x; state.serverPos.y = y;
          continue;
        }
        const o = remotes.get(id);
        if (o) { o.tx = x; o.ty = y; o.tr = r; }
        else {
          upsertRemote(id, x, y, r, null);
          // AI'A NOT: "belirdi" anonsu sunucudan ayrıca gelir; buradaki sadece emniyet kemeri.
          // Tekrar basmamak için isim bazlı `seen` kümesi kullanılır.
        }
      }
      break;
    }

    // -----------------------------------------------------------------------
    // M2i — KORSANLAR (kullanıcı isteği): korsan gemileri, istasyonu ve hasar çubukları.
    // Korsan da "uzak gemi" (remotes) olarak taşınır → kilit (T), tarama (E) ve minimap
    // HİÇBİR ek kod olmadan korsanı da kapsar (tek nesne türü, tek kod yolu).
    // -----------------------------------------------------------------------
    case 'npc': {
      const o = upsertRemote(m.id, m.x, m.y, m.r, m.callsign, true);
      if (Number.isFinite(m.max)) { o.hp = m.hp; o.hpMax = m.max; }
      break;
    }
    case 'npchp': {
      const o = remotes.get(m.id);
      if (o) { o.hp = m.hp; o.hpMax = m.max; }
      break;
    }
    case 'npcgone': {
      const o = remotes.get(m.id);
      if (o && m.why === 'killed') {
        fxAdd({ kind: 'boom', ms: 500, x: o.group.x, y: o.group.y });
        flash(0xff8040);
        if (near(o.group.x, o.group.y, 1800)) sfx.boom();
      }
      removeRemote(m.id);
      break;
    }
    case 'stathp':
      if (state.station) state.station.hp = m.hp;
      break;
    case 'stationgone':
      if (stationBox || state.station) {
        const sx = m.x, sy = m.y;
        setStation(null);
        fxAdd({ kind: 'boom', ms: 900, x: sx, y: sy });
        flash(0xff8040);
        if (near(sx, sy, 2600)) sfx.boom();
      }
      break;

    case 'chat': {
      // M3: kanal etiketi + gönderen. `dm` = özel mesaj (echo = benim gönderdiğimin kopyası).
      const tag = { g: 'G', s: 'S', l: 'L', p: 'P' }[m.ch] || '?';
      const who = m.dm
        ? (m.echo ? t('chat_dm_to', { name: m.to }) : t('chat_dm_from', { name: m.from }))
        : m.from;
      logLine(`[${tag}] ${who}: ${m.m}`, 'chat');
      if (m.dm && !m.echo) sfx.ui();                 // özel mesaj geldi → kısa tık sesi
      break;
    }

    case 'sys':
      // AI'A NOT: Sunucu her oyuncu için "X sistemde belirdi" anonsu yollar; aynı ismi tekrar
      // yazmamak için `seen` ile süzülür (aynı çağrı işareti ikinci kez loglanmaz).
      if (m.code === 'chat') { logLine(m.msg, 'chat'); break; }
      // AI'A NOT: Sunucu artık metin yerine KOD + PARAMETRE yollar (`code` / `p`) → istemci kendi
      // diline çevirir. Kod tanınmıyorsa sunucunun kendi metni (`msg`) gösterilir.
      if (m.code === 'appear' || /belirdi\.$/.test(m.msg || '')) {
        const name = (m.p && m.p.name) || String(m.msg || '').split(' ')[0];
        if (announced.has(name)) break;
        announced.add(name);
      }
      logLine(sysText(m), 'sys');
      if (m.code === 'warp_ok') { flash(); sfx.warp(); }
      else if (m.code === 'warp_range' || m.code === 'warp_nocell'
        || m.code === 'craft_fail' || m.code === 'use_need' || m.code === 'use_full') sfx.alarm();
      else if (m.code === 'refuel_ok') sfx.refuel();
      // M2e: YAKIT DOLUMU BİTTİYSE istemci bayrağı da kapanır (sunucu tek gerçek kaynak —
      // istemci "doluyor" sanıp yanlış göstermesin). Sebep zaten log satırında yazar.
      else if (m.code === 'refuel_far' || m.code === 'refuel_full') { state.refueling = false; sfx.alarm(); }
      else if (m.code === 'refuel_off') state.refueling = false;
      else if (m.code === 'refuel_start') state.refueling = true;
      else if (m.code === 'loot_drop') sfx.pickDrop();     // M2e: kapsül uzaya düştü
      break;

    case 'hb':
      lastHbAck = performance.now();
      if (m.c === hbSeq) ping = Math.round(lastHbAck - hbSentAt);
      break;

    // --- M2 PAKETLERİ -------------------------------------------------------
    case 'shot': {
      // Ateş görseli: kim ateşlediyse onun konumundan ışın. Kendi atışımızda yerel ışın
      // zaten çizildi (tryFire) — sunucu paketi aynı yeri çizer, gözle görülür fark yok.
      const o = m.id === state.you ? null : remotes.get(m.id);
      const sx = o ? o.group.x : state.me.x, sy = o ? o.group.y : state.me.y;
      fxAdd({ kind: 'beam', ms: 110, color: 0x8ff0ff, x1: sx, y1: sy, x2: m.hx, y2: m.hy });
      if (m.id !== state.you && near(sx, sy, 1500)) sfx.laserFar();
      break;
    }
    case 'dmg': {
      if (m.id === state.you) {
        // Bize vuruldu: HUD güncelle + ekran kenarını kırmızı yak.
        state.shield = m.shield; state.hull = m.hull;
        state.lastHitAt = performance.now();    // M3d: kalkan regen gecikmesi buradan sayılır
        flash(0xff4040);
        logLine(t('hit', { dmg: m.dmg, shield: m.shield, hull: m.hull }), 'warn');
        sfx.hit(); if (m.hull < 35) sfx.alarm();
      } else if (near(m.x, m.y, 1500)) sfx.hit();
      fxAdd({ kind: 'spark', ms: 260, x: m.x, y: m.y });
      break;
    }
    // M3d: KALKAN paketi — sunucu kalkanı kendiliğinden doldururken HUD'u akıcı tutar
    // (hasar paketi yalnız DÜŞÜŞÜ taşır; dolum ayrı ve hafif bir paketle gelir).
    case 'sh': {
      if (Number.isFinite(m.v)) state.shield = m.v;
      break;
    }
    // --- M4a: ANOMALİ paketleri -------------------------------------------
    // HP yalnız kalıntı türlerinde anlamlı; sinyalde gönderilmez (sunucu hp=0 yollar).
    case 'anomhp': {
      if (state.anom && m.id === state.anom.id) state.anom.hp = m.hp;
      break;
    }
    case 'anom_hint': {
      state.anomHint = m.hint;
      logLine(t('anom_hint_ui', { hint: m.hint }), 'warn');
      sfx.ping();
      break;
    }
    case 'anom_solved': {
      const kind = state.anom ? state.anom.kind : 'RUIN';
      sfx.pickUp();
      logLine(t('anom_solved_ui', { kind: t('kind_' + kind) }), 'ok');
      if (state.anom) { state.anom.solved = true; syncAnomaly(state.anom); }
      break;
    }
    case 'anomgone': {
      logLine(t('anom_gone'), 'warn');
      syncAnomaly(null);
      break;
    }
    case 'rockhp': {
      const r = rocks.get(m.id);
      if (r) { r.hp = m.hp; r.maxHp = m.max; }
      if (near(m.x, m.y, 1500)) sfx.crack();
      break;
    }
    case 'rockgone': {
      const r = rocks.get(m.id);
      if (r) {
        fxAdd({ kind: 'boom', ms: 420, x: r.g.x, y: r.g.y });
        if (near(r.g.x, r.g.y, 1800)) sfx.boom();
        r.g.destroy({ children: true });
        rocks.delete(m.id);
      }
      break;
    }
    case 'rocknew': addRock(m.id, m.x, m.y, m.size, m.hp, m.ore); break;
    case 'rockmv': for (const [id, x, y] of m.d) { const r = rocks.get(id); if (r) { r.g.x = x; r.g.y = y; } } break;
    case 'boom':
      fxAdd({ kind: 'boom', ms: 600, x: m.x, y: m.y });
      flash(0xff8040);
      if (near(m.x, m.y, 1800)) sfx.boom();
      break;
    case 'loot':
      state.cargo = m.cargo || state.cargo;   // sunucu envanterin TEK KAYNAĞI
      sfx.loot();
      break;
    case 'fuel':                              // M2b: yakıt (sunucu otoriter, tam sayı değişince)
      state.fuel = m.v; state.fuelMax = m.max;
      if (state.refueling && state.fuel >= state.fuelMax - 0.01) state.refueling = false;  // depo doldu
      break;

    // --- M2e: UZAYA DÜŞEN KAPSÜLLER ---
    case 'pick':                              // yeni kapsül düştü (cevher rengiyle)
      addPickup(m.id, m.x, m.y, m.ore, m.amount);
      if (near(m.x, m.y, 1800)) sfx.pickDrop();
      break;
    case 'pickmv':                            // süzülen kapsüller (yalnız hareket edenler gelir)
      for (const [id, x, y] of m.d) {
        const pk = pickups.get(id);
        if (pk) { pk.group.x = x; pk.group.y = y; }
      }
      break;
    case 'pickgone': {                        // toplandı ya da ömrü bitti
      const pk = pickups.get(m.id);
      if (pk) {
        if (m.by === state.you) {
          sfx.loot();
          logLine(t('loot_pick', { amount: pk.amount, ore: pk.ore }));
        } else if (near(pk.group.x, pk.group.y, 900)) sfx.loot();
        removePickup(m.id);
      }
      break;
    }

    case 'ev':
      if (m.kind === 'death') logLine(t('destroyed', { name: m.id }), 'sys');
      break;
  }
}

// ===========================================================================
// 9b) M2 — ATEŞ / MADENCİLİK / TRACTOR (istemci tarafı)
// ===========================================================================
// AI'A NOT: İstemci ışını ANINDA çizer (yerel ışın taraması) — sunucu yanıtını beklemez, bu
// yüzden ateş "gecikmesiz" hisseder. Hasar YOK: hasarı sunucu 'shot'/'dmg' paketleriyle bildirir.
function localRayPick(dx, dy, range) {
  let best = null, bestAlong = Infinity;
  const test = (x, y, radius) => {
    const vx = x - state.me.x, vy = y - state.me.y;
    const along = vx * dx + vy * dy;
    if (along < 0.5 || along > range) return;
    if (Math.abs(-vx * dy + vy * dx) > radius) return;
    if (along < bestAlong) { bestAlong = along; best = { x, y }; }
  };
  for (const [, o] of remotes) test(o.group.x, o.group.y, PLAYER_RADIUS);
  for (const [, r] of rocks) test(r.g.x, r.g.y, (r.size || 16) / 2 + 2);
  return best;
}

// AI'A NOT: KULLANICI İSTEĞİ — "oyunun ateş etme sistemini değiştir: mouse ile basılan yere ateş
// etsin, space'e basınca olduğu gibi tekrarlayarak". Bu yüzden nişan artık FARE ile belirlenir:
//   · fare hareket ettikçe state.aim dünya koordinatını takip eder (nişangâh çizilir),
//   · SOL TIK → nişan noktasına ateş, SPACE (basılı tutulunca) → cooldown'a uyarak TEKRAR,
//   · hiç nişan yoksa eski davranış: gemi burnu.
// Açı sunucuya da yollanır (msg.r) → sunucu ışını AYNI yönde tarar. İstemci yalnız çizer.
function aimAngle() {
  if (!state.aim) return state.me.r;
  const dx = state.aim.x - state.me.x, dy = state.aim.y - state.me.y;
  if (Math.hypot(dx, dy) <= 4) return state.me.r;    // çok yakın nişan → burna düş
  return Math.atan2(dx, -dy);                        // sprite r=0'da YUKARI bakar (sunucu kuralı)
}

function tryFire(now, angleOverride) {
  if (state.mapOpen || chatOpen || MENU.open || state.craftOpen) return;   // M2g/M2h: paneller ateşi keser
  if (now - state.lastFireAt < FIRE_COOLDOWN_MS) return;
  state.lastFireAt = now;
  const ang = Number.isFinite(angleOverride) ? angleOverride : aimAngle();
  state.lastAimAngle = ang;
  send({ t: 'fire', r: Number(ang.toFixed(3)) });
  sfx.laser();
  const dx = Math.sin(ang), dy = -Math.cos(ang);
  const hit = localRayPick(dx, dy, FIRE_RANGE);
  fxAdd({ kind: 'beam', ms: 110, color: 0x8ff0ff,
    x1: state.me.x, y1: state.me.y,
    x2: hit ? hit.x : state.me.x + dx * FIRE_RANGE,
    y2: hit ? hit.y : state.me.y + dy * FIRE_RANGE });
}

// F: en yakın HEDEFİ (önce DÜŞEN KAPSÜL, sonra kaya) tractor beam ile çek / kapat.
// AI'A NOT: Kullanıcı isteği — "tractor beam de çekebilecek pickupları". Kapsül önceliklidir:
// küçük, hareketli ve genelde kayanın yanında olduğu için oyuncunun asıl istediği odur.
function toggleTractor() {
  if (state.tractorOn) { state.tractorOn = false; send({ t: 'tb', on: false }); return; }
  let best = null, bestD = TRACTOR_RANGE, bestIsPick = false;
  for (const [id, pk] of pickups) {
    const d = Math.hypot(pk.group.x - state.me.x, pk.group.y - state.me.y);
    if (d < bestD) { bestD = d; best = id; bestIsPick = true; }
  }
  if (!best) {
    for (const [id, r] of rocks) {
      const d = Math.hypot(r.g.x - state.me.x, r.g.y - state.me.y);
      if (d < bestD) { bestD = d; best = id; bestIsPick = false; }
    }
  }
  if (!best) { logLine(t('tractor_none'), 'warn'); return; }
  state.tractorOn = true;
  state.tractorTarget = best;
  state.tractorIsPick = bestIsPick;
  send({ t: 'tb', on: true, tid: best });
  logLine(t(bestIsPick ? 'tractor_pick' : 'tractor_rock'));
}

// ===========================================================================
// 9c) M2e — UZAYA DÜŞEN KAPSÜLLER (istemci tarafı)
// ===========================================================================
// AI'A NOT: Sunucu kaya kırıldığında kapsül yaratır ('pick' paketi) ve TEMASLA toplar. İstemci
// kapsülü çizer (cevher renginde kristal + nabız atan hale), radar'da gösterir ve tractor
// hedefi olarak işaretler. Toplama KARARI sunucuda — istemci yalnız görselleştirir.
function addPickup(id, x, y, ore, amount) {
  if (pickups.has(id)) { const p0 = pickups.get(id); p0.group.x = x; p0.group.y = y; return p0; }
  const col = P.ore[ore] || 0xffffff;
  const body = pixelSprite(PICK_ROWS, { x: col, X: 0xffffff });
  body.scale.set(2);                                  // 7x7 → 14x14 (görünür ama küçük)
  const glow = new PIXI.Graphics();
  glow.circle(0, 0, 11).fill({ color: col, alpha: 0.20 });
  glow.blendMode = 'add';
  const ring = new PIXI.Graphics();                   // tractor hedefi olunca görünür
  ring.circle(0, 0, 15).stroke({ width: 1, color: col, alpha: 0.9 });
  ring.visible = false;
  const group = new PIXI.Container();
  group.addChild(glow, body, ring);
  group.x = x; group.y = y;
  world.addChild(group);                              // kapsüller kaya/gemi gibi dünyada
  const pk = { group, glow, ring, ore, amount, bornAt: performance.now(), phase: Math.random() * 6.28 };
  pickups.set(id, pk);
  return pk;
}

function removePickup(id) {
  const pk = pickups.get(id);
  if (!pk) return;
  pk.group.destroy({ children: true });
  pickups.delete(id);
  if (state.tractorTarget === id) { state.tractorOn = false; state.tractorTarget = null; }
}

// Efekt listesi: kısa ömürlü (beam/spark/boom), her karede tek Graphics'e çizilir.
const fx = [];
function fxAdd(o) {
  o.until = performance.now() + o.ms;
  fx.push(o);
  if (fx.length > 48) fx.shift();   // tavan: yoğun çatışmada bile bellek sabit
}
function drawFx(now) {
  fxG.clear();
  for (let i = fx.length - 1; i >= 0; i--) {
    const e = fx[i];
    const left = e.until - now;
    if (left <= 0) { fx.splice(i, 1); continue; }
    const k = Math.max(0, Math.min(1, left / e.ms));   // 1 → yeni, 0 → sönmek üzere
    if (e.kind === 'beam') {
      fxG.moveTo(e.x1, e.y1).lineTo(e.x2, e.y2).stroke({ width: 1, color: e.color, alpha: k });
      fxG.rect(Math.round(e.x2) - 1, Math.round(e.y2) - 1, 2, 2).fill({ color: 0xffffff, alpha: k });
    } else if (e.kind === 'spark') {
      fxG.circle(e.x, e.y, (1 - k) * 10).stroke({ width: 1, color: 0xffd08a, alpha: k });
    } else if (e.kind === 'boom') {
      const r = (1 - k) * 44;
      fxG.circle(e.x, e.y, r).stroke({ width: 1, color: 0xff9a5a, alpha: k });
      fxG.circle(e.x, e.y, r * 0.55 + 3).fill({ color: 0xffc46b, alpha: k * 0.45 });
    }
  }
  // Kaya hasar çubukları (yalnız hasarlı kayalar → tipik olarak birkaç tane)
  rockBars.clear();
  for (const [, r] of rocks) {
    if (!r.maxHp || r.hp >= r.maxHp) continue;
    const w = 14, x = Math.round(r.g.x - w / 2), y = Math.round(r.g.y - (r.size || 16) * 0.6 - 5);
    rockBars.rect(x, y, w, 2).fill({ color: 0x1a2028, alpha: 0.9 });
    rockBars.rect(x, y, Math.max(1, Math.round(w * r.hp / r.maxHp)), 2).fill(0xffb46b);
  }
}

// ===========================================================================
// 9c) SES — TAMAMEN SENTEZ (dosya yok). "Gizemli derin uzay" atmosferi.
// ===========================================================================
// AI'A NOT: Ses dosyası/asset YOK; her ses WebAudio ile üretilir (osilatör + filtrelenmiş
// gürültü + zarf). Neden: oyun piksel sanatı gibi "kodda" yaşasın, build/asset adımı olmasın.
// Tarayıcı autoplay kuralı: AudioContext ilk KULLANICI ETKİLEŞİMİNDE açılır (ensure()).
// Atmosfer katmanları: (1) sürekli drone (iki detune sinüs + yavaş LFO), (2) itişe bağlı motor
// uğultusu, (3) seyrek "uzak ping" — üçü birlikte ıssız/gerilimli bir his verir.
// M2g: SES SEVİYESİ TEK YERDEN. Susturma (0) ve kaydırmalı ses ayarı (0..1 × 0.62) burada
// birleşir; mute açıkken seviye değişse bile ses 0 kalır (iki ayar birbirini ezmez).
function masterLevel() { return state.muted ? 0 : 0.62 * VOLUME; }
const sfx = (() => {
  let ctx = null, master = null, humOsc = null, humGain = null, dist = null;

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = masterLevel();
    const comp = ctx.createDynamicsCompressor();   // patlamalar HUD sesini bastırmasın
    master.connect(comp).connect(ctx.destination);

    // Uzaklık hissi: kısa geri beslemeli gecikme (ucuz "mağara/uzay" yankısı).
    dist = ctx.createDelay(0.6); dist.delayTime.value = 0.26;
    const fb = ctx.createGain(); fb.gain.value = 0.28;
    const dw = ctx.createGain(); dw.gain.value = 0.22;
    dist.connect(fb).connect(dist); dist.connect(dw).connect(master);

    // (1) ORTAM DRONE'U — çok alçak frekanslar, yavaş nefes
    const dg = ctx.createGain(); dg.gain.value = 0.055;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
    dg.connect(lp).connect(master);
    [41.2, 41.9, 82.4].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = i === 2 ? 'triangle' : 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = i === 2 ? 0.22 : 0.5;
      o.connect(g).connect(dg); o.start();
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.031 + i * 0.019;
      const lg = ctx.createGain(); lg.gain.value = 0.16;
      lfo.connect(lg).connect(g.gain); lfo.start();
    });

    // (2) MOTOR UĞULTUSU — şiddeti/tonu itişe göre ticker'da güncellenir
    humOsc = ctx.createOscillator(); humOsc.type = 'sawtooth'; humOsc.frequency.value = 70;
    humGain = ctx.createGain(); humGain.gain.value = 0;
    const hlp = ctx.createBiquadFilter(); hlp.type = 'lowpass'; hlp.frequency.value = 340;
    humOsc.connect(hlp).connect(humGain).connect(master);
    humOsc.start();
    return ctx;
  }

  // Tek seferlik zarf yardımcısı (attack/decay + tepe değer).
  function env(g, t0, peak, atk, dec) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + atk + dec);
  }
  function tone({ type = 'sine', f0 = 440, f1 = null, peak = 0.2, atk = 0.005, dec = 0.25, delay = 0, echo = 0 }) {
    if (!ensure()) return;
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + atk + dec);
    const g = ctx.createGain();
    env(g, t0, peak, atk, dec);
    o.connect(g); g.connect(echo ? dist : master);
    if (echo) { const e = ctx.createGain(); e.gain.value = echo; g.connect(e).connect(master); }
    o.start(t0); o.stop(t0 + atk + dec + 0.05);
  }
  function noise({ peak = 0.3, atk = 0.002, dec = 0.3, lp = 900, hp = 60, delay = 0, echo = 0 }) {
    if (!ensure()) return;
    const t0 = ctx.currentTime + delay;
    const s = ctx.createBufferSource();
    const len = Math.max(1, Math.floor(ctx.sampleRate * (atk + dec + 0.05)));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    s.buffer = buf;
    const f1 = ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.frequency.value = lp;
    const f2 = ctx.createBiquadFilter(); f2.type = 'highpass'; f2.frequency.value = hp;
    const g = ctx.createGain(); env(g, t0, peak, atk, dec);
    s.connect(f2).connect(f1).connect(g);
    g.connect(echo ? dist : master);
    if (echo) { const e = ctx.createGain(); e.gain.value = echo; g.connect(e).connect(master); }
    s.start(t0); s.stop(t0 + atk + dec + 0.05);
  }

  return {
    ensure,
    // Test/probe için: ses motoru gerçekten çalışıyor mu? (AudioContext kullanıcı
    // etkileşiminden önce 'suspended' kalır — otomasyon "ses var" diyemez, bu yüzden ölçülür.)
    ready() { return !!ctx && ctx.state === 'running'; },
    // İtiş: 0..1 → motor uğultusunun şiddeti + frekansı
    engine(v) {
      if (!ctx || !humGain) return;
      const k = Math.max(0, Math.min(1, v));
      humGain.gain.setTargetAtTime(0.02 + k * 0.09, ctx.currentTime, 0.08);
      humOsc.frequency.setTargetAtTime(58 + k * 46, ctx.currentTime, 0.12);
    },
    laser() { tone({ type: 'square', f0: 1250, f1: 220, peak: 0.13, dec: 0.13 }); },
    // M2h: TARAMA — yükselen yumuşak süpürme (gizemli, "sonar" hissi).
    scan() { tone({ type: 'sine', f0: 260, f1: 1250, peak: 0.09, dec: 0.55, echo: 0.35 }); },
    // M2h: KİLİT — iki kısa keskin blip (nişan alma klik-klak hissi).
    lock() { tone({ type: 'square', f0: 1500, f1: 1500, peak: 0.06, dec: 0.05 }); setTimeout(() => tone({ type: 'square', f0: 1150, f1: 1150, peak: 0.06, dec: 0.06 }), 90); },
    // M2h: ZANAAT — metalik vuruş.
    craft() { noise({ peak: 0.12, dec: 0.16, lp: 1800, hp: 300 }); },
    laserFar() { tone({ type: 'square', f0: 900, f1: 180, peak: 0.05, dec: 0.16, echo: 0.5 }); },
    hit() { noise({ peak: 0.18, dec: 0.14, lp: 2600, hp: 400 }); },
    crack() { noise({ peak: 0.14, dec: 0.11, lp: 1500, hp: 200 }); },
    boom() {
      noise({ peak: 0.5, dec: 0.75, lp: 480, hp: 40, echo: 0.4 });
      tone({ type: 'sine', f0: 120, f1: 32, peak: 0.4, dec: 0.6 });
    },
    loot() { tone({ type: 'triangle', f0: 660, peak: 0.14, dec: 0.1 }); tone({ type: 'triangle', f0: 990, peak: 0.12, dec: 0.16, delay: 0.08 }); },
    warp() {
      tone({ type: 'sine', f0: 140, f1: 1700, peak: 0.22, atk: 0.35, dec: 0.5, echo: 0.6 });
      noise({ peak: 0.2, atk: 0.3, dec: 0.5, lp: 2400, hp: 300, echo: 0.5 });
    },
    refuel() { tone({ type: 'sawtooth', f0: 90, f1: 260, peak: 0.12, atk: 0.12, dec: 0.35 }); },
    // M2e: uzaya kapsül düştü (aşağı doğru inen yumuşak "düşüş" tonu) ve kapsül toplandı.
    pickDrop() { tone({ type: 'sine', f0: 880, f1: 380, peak: 0.10, dec: 0.26 }); },
    pickUp() { tone({ type: 'triangle', f0: 520, f1: 1180, peak: 0.13, dec: 0.15 }); },
    alarm() { tone({ type: 'square', f0: 300, peak: 0.16, dec: 0.12 }); tone({ type: 'square', f0: 220, peak: 0.16, dec: 0.18, delay: 0.16 }); },
    ui() { tone({ type: 'square', f0: 1400, peak: 0.06, dec: 0.05 }); },
    ping() { tone({ type: 'sine', f0: 1650, peak: 0.05, dec: 2.4, echo: 0.9 }); },   // uzak, yalnız sinyal
    mute(on) { if (master) master.gain.setTargetAtTime(on ? 0 : masterLevel(), ctx.currentTime, 0.05); },
    // M2g: MENÜDEKİ KAYDIRMALI SES AYARI. masterLevel() tek yerden hesaplanır: susturma (0) ve
    // ses seviyesi (0..1 × 0.62) çarpışmasın — mute açıkken seviye değişse de ses 0 kalır.
    setVolume(v) { VOLUME = v; if (master) master.gain.setTargetAtTime(masterLevel(), ctx.currentTime, 0.05); },
  };
})();

// AI'A NOT: Uzaklık kapısı — 1500-1800 birimden uzaktaki olayların sesi ÇALINMAZ. Ucuz ve
// etkili bir "hacim/mekân" hissi: uzaktaki patlama duyulmaz, yakındaki duyulur.
function near(x, y, r) {
  const dx = x - state.me.x, dy = y - state.me.y;
  return dx * dx + dy * dy <= r * r;
}

function logLine(text, kind = 'sys') {
  state.log.push({ text, kind, ts: performance.now() });
  if (state.log.length > 40) state.log.shift();
}
function whisper(text, strong = false) {
  state.whispers.push({ text, ts: performance.now(), strong });
  state.whispers = state.whispers.slice(-3);
}
const pick = (a) => a[Math.floor(Math.random() * a.length)];
// AI'A NOT: Sunucu mesajı → aktif dilde metin. Kod sözlükte varsa ÇEVİRİ, yoksa sunucunun
// kendi metni (eski sunucu + yeni istemci uyumu). Parametreler `m.p` içinde gelir.
function sysText(m) {
  const known = (STR[LANG] && STR[LANG][m.code] !== undefined) || STR.en[m.code] !== undefined;
  return known ? t(m.code, m.p || {}) : (m.msg || m.code);
}
function anomalyText(kind) {
  // AI'A NOT: Anomali metni artık SÖZLÜKTEN (STR.a_*) — dile göre değişir.
  const key = {
    DERELICT: 'a_derelict', SILENT_BEACON: 'a_beacon', RUIN: 'a_ruin',
    GRAVEYARD: 'a_graveyard', OBSCURED_SIGNAL: 'a_obscured',
  }[kind];
  return t(key || 'a_unknown');
}

// AI'A NOT: Sistem yıldızı — büyük, sınıf renginde, hafif nabızlı. Sistemin kalbi (0,0).
function buildStar(star) {
  starGroup.removeChildren().forEach(c => c.destroy({ children: true }));
  if (!star) return;
  const col = P.starC[star.c] ?? 0xffffff;
  const halo = new PIXI.Graphics();
  halo.circle(0, 0, 96).fill({ color: col, alpha: 0.08 });
  halo.circle(0, 0, 68).fill({ color: col, alpha: 0.13 });
  halo.circle(0, 0, 44).fill({ color: col, alpha: 0.26 });
  halo.blendMode = 'add';
  const core = new PIXI.Graphics();
  core.circle(0, 0, 28).fill(col);
  core.circle(0, 0, 33).stroke({ width: 1, color: col, alpha: 0.5 });
  // M2e: YAKIT DOLUM BÖLGESİ halkası (kullanıcı isteği: dolum YALNIZ yıldızın dibinde).
  // Görünür kılavuz: oyuncu halkanın içindeyken Y çalışır. Sunucudaki REFUEL_RANGE ile AYNI.
  const zone = new PIXI.Graphics();
  zone.circle(0, 0, REFUEL_RANGE).stroke({ width: 1, color: 0x2f6fa8, alpha: 0.28 });
  zone.circle(0, 0, REFUEL_RANGE - 8).stroke({ width: 1, color: 0x1d4a6a, alpha: 0.16 });
  starGroup.addChild(halo, core, zone);
  starGroup._halo = halo; starGroup._phase = 0;
}

function addRock(id, x, y, size, hp, ore) {
  // Boyuta göre 3 sprite varyantı + ore rengine göre 1 piksellik cevher parıltısı.
  const variant = size < 16 ? 0 : size < 24 ? 1 : 2;
  const g = pixelSprite(ROCK_ROWS[variant], ROCK_PAL);
  g.scale.set(Math.max(1, Math.round(size / 8)));
  const glint = new PIXI.Graphics();
  glint.rect(Math.round(Math.random() * 4 - 2), Math.round(Math.random() * 4 - 2), 1, 1)
    .fill(P.ore[ore] || 0xffffff);
  const grp = new PIXI.Container();
  grp.addChild(g, glint);
  grp.x = x; grp.y = y;
  world.addChild(grp);
  rocks.set(id, { g: grp, ore, hp, size, glint, maxHp: hp });
}

function upsertRemote(id, x, y, r, callsign, pirate) {
  let o = remotes.get(id);
  if (!o) {
    // M2i: palet SEÇİMİ doğuşta yapılır (korsan = kırmızı gövde). Sonradan palet değiştirmek
    // yok: `pixelSprite` yeni doku üretir, mevcut sprite'ın rengini değiştirmek zahmetli olurdu.
    const body = pixelSprite(SHIP_ROWS, pirate ? PIRATE_PAL : REMOTE_PAL);
    body.scale.set(SHIP_SCALE);                 // uzak gemiler de 2x (aynı gövde)
    const glow = new PIXI.Graphics();
    glow.circle(0, 8, 12).fill({ color: pirate ? 0xff6a3a : 0xff5a8a, alpha: pirate ? 0.2 : 0.12 });
    glow.blendMode = 'add';
    const group = new PIXI.Container();
    group.addChild(glow, body);
    world.addChild(group);
    o = { group, callsign: callsign || '?', tx: x, ty: y, tr: r || 0, pirate: !!pirate };
    o.group.x = x; o.group.y = y;
    remotes.set(id, o);
  }
  if (callsign) o.callsign = callsign;
  o.tx = x; o.ty = y; o.tr = r ?? o.tr;
  return o;
}
// M2i — KORSAN İSTASYONU: sahnede tek nesne (kaya gibi statik). Yeniden bağlanma/warp'ta
// yeniden kurulur; `sn` null gelirse silinir.
let stationBox = null, stationBar = null, npcBars = null;
function setStation(st) {
  if (stationBox) { stationBox.destroy({ children: true }); stationBox = null; stationBar = null; }
  state.station = st ? { x: st.x, y: st.y, hp: st.hp, max: st.max, id: st.id } : null;
  if (!st) return;
  const body = pixelSprite(STATION_ROWS, STATION_PAL);
  body.scale.set(SHIP_SCALE);
  stationBar = new PIXI.Graphics();
  stationBox = new PIXI.Container();
  stationBox.addChild(stationBar, body);
  stationBox.x = st.x; stationBox.y = st.y;
  world.addChild(stationBox);
}
// M2i — hasar çubukları: korsan gemileri ve istasyon için (yalnız HASAR ALDIKLARINDA görünür →
// "her şeyin tepesinde bar" kalabalığı olmaz; vurduğun şeyin canı olduğunu anlarsın).
function drawNpcBars() {
  if (!npcBars) { npcBars = new PIXI.Graphics(); world.addChild(npcBars); }
  npcBars.clear();
  for (const [, o] of remotes) {
    if (!o.pirate || !o.hpMax || o.hp === undefined || o.hp >= o.hpMax) continue;
    const g = o.group;
    npcBars.rect(g.x - 11, g.y - 21, 22, 3).fill({ color: 0x1a0d0d, alpha: 0.85 });
    npcBars.rect(g.x - 10, g.y - 20, Math.round(20 * Math.max(0, o.hp / o.hpMax)), 1).fill(0xff6a4a);
  }
  const st = state.station;
  if (st && st.hp < st.max) {
    npcBars.rect(st.x - 22, st.y - 30, 44, 5).fill({ color: 0x1a0d0d, alpha: 0.85 });
    npcBars.rect(st.x - 21, st.y - 29, Math.round(42 * Math.max(0, st.hp / st.max)), 3).fill(0xff9a5a);
  }
  // M4a: ANOMALİ CAN ÇUBUĞU — yalnız KALINTI türlerinde (sinyalde hp yok) ve hasar almışsa
  // görünür; mor bar "bu şey nasıl bir şey?" hissini bilgiyle destekler (sunucu anomhp yollar).
  const an = state.anom;
  if (an && !an.signal && !an.solved && an.max > 0 && an.hp < an.max) {
    npcBars.rect(an.x - 22, an.y - 30, 44, 5).fill({ color: 0x140f22, alpha: 0.85 });
    npcBars.rect(an.x - 21, an.y - 29, Math.round(42 * Math.max(0, an.hp / an.max)), 3).fill(0xb59cf0);
  }
}
function removeRemote(id) {
  const o = remotes.get(id);
  if (!o) return;
  o.group.destroy({ children: true });
  remotes.delete(id);
}

const chatin = document.getElementById('chatin');
const chatbar = document.getElementById('chatbar');
const chatwf = document.getElementById('chatwf');
const chathelp = document.getElementById('chathelp');
let chatOpen = false;

// ===========================================================================
// M3 — SOHBET: 4 KANAL. TAB sırayla kanal değiştirir: YEREL → SEKTÖR → GLOBAL → ÖZEL.
// `@isim mesaj` yazımı HER kanalda özel mesaja döner ve hedef HATIRLANIR (sonraki mesajlar
// aynı kişiye gider). Sunucu otoriter: kanal geçerliliği, uzunluk ve rate limit orada doğrulanır.
// ===========================================================================
const CHAT_CH = ['l', 's', 'g', 'p'];
let chatCh = 'l';
let dmTo = '';                                  // son özel mesaj hedefi (çağrı işareti)
function chatChanName() { return t('chat_ch_' + chatCh); }
function chatUI() {
  // M3: rozet = [KANAL] + KENDİ ÇAĞRI İŞARETİN. İkincisi ÖZEL mesajın anahtarı: başkasının
  // sana DM atabilmesi için kendi ismini görebilmen şart (eskiden hiçbir yerde yazmıyordu).
  if (chatwf) {
    chatwf.textContent = '[' + chatChanName() + ']' + (state.callsign ? ' ' + state.callsign : '');
  }
  if (chathelp) chathelp.textContent = t('chat_help');
  if (chatin) {
    chatin.placeholder = dmTo ? t('chat_ph_dm', { name: dmTo }) : t('chat_ph_' + chatCh);
  }
}
function chatShow(on) {
  chatOpen = on;
  const d = on ? 'block' : 'none';
  chatin.style.display = d;
  if (chatbar) chatbar.style.display = on ? 'flex' : 'none';
  if (on) chatUI();
}
function sendChat(raw) {
  let ch = chatCh, to = dmTo, m = raw;
  const mm = /^@([A-Za-z0-9_-]+)\s+(.+)$/.exec(raw);   // @isim mesaj → özel
  if (mm) { to = mm[1]; m = mm[2].trim(); ch = 'p'; dmTo = to; }
  if (ch === 'p' && !to) { logLine(t('chat_need_target'), 'sys'); return; }
  send({ t: 'chat', ch, m, to: ch === 'p' ? to : undefined });
  chatUI();
}

addEventListener('keydown', (e) => {
  keys[e.code] = true;
  // M4a: ANOMALİ kodu girişi AÇIKKEN tüm diğer kısayollar devre dışı — kod yazarken gemi
  // fırlamasın, zanaat menüsü açılmasın (Tuzak 43: yeni kısayol başka tuşu sessizce ezebilir).
  if (state.anomInputOpen && !chatOpen) {
    if (PROBE) window.__anomKeys = ((window.__anomKeys || '') + e.code + ';').slice(-60);   // TEST: hangi tuşlar buraya düştü
    if (/^Digit[0-9]$/.test(e.code) && state.anomBuf.length < 4) state.anomBuf += e.code.slice(5);
    else if (/^Numpad[0-9]$/.test(e.code) && state.anomBuf.length < 4) state.anomBuf += e.code.slice(6);
    else if (e.code === 'Backspace') state.anomBuf = state.anomBuf.slice(0, -1);
    else if (e.code === 'Enter') submitAnomalyCode();
    else if (e.code === 'Escape') { state.anomInputOpen = false; state.anomBuf = ''; }
    e.preventDefault();
    return;
  }
  if (chatOpen) {
    if (e.code === 'Tab') {                       // kanal değiştir
      e.preventDefault();
      chatCh = CHAT_CH[(CHAT_CH.indexOf(chatCh) + 1) % CHAT_CH.length];
      chatUI(); sfx.ui();
      return;
    }
    if (e.code === 'Enter') {
      const v = chatin.value.trim();
      if (v) sendChat(v);
      chatin.value = ''; chatShow(false);
    }
    if (e.code === 'Escape') { chatin.value = ''; chatShow(false); }
    e.stopPropagation();
    return;
  }
  // AI'A NOT: `e.repeat` KONTROLÜ ŞART. Tuşu basılı tutunca keydown tekrarlanır ve toggle
  // iki kez tetiklenir → harita açılıp anında kapanır ("harita açılmıyor" şikâyetinin sebebi).
  if (e.repeat) return;
  sfx.ensure();                                   // ilk tuş = ses kilidinin açılması (autoplay kuralı)
  if (e.code === 'KeyM') { toggleMap(); sfx.ui(); }
  // M2g: O = MENÜ (dil + ses). ESC menü açıkken menüyü kapatır (harita kontrolünden ÖNCE).
  else if (e.code === 'KeyO') { toggleMenu(); }
  else if (e.code === 'Escape' && MENU.open) { toggleMenu(false); sfx.ui(); }
  else if (e.code === 'Escape' && state.mapOpen) { toggleMap(); sfx.ui(); }
  else if (e.code === 'Enter' && state.mapOpen) { warpToCenter(); e.preventDefault(); }
  // AI'A NOT: R = haritayı KENDİ YILDIZIMA geri ortala. Kullanıcı geri bildirimi: pan ile
  // kendi yıldızı pencere dışına çıkınca geri dönüş yolu yoktu ("harita benim olduğum yıldızı
  // göstermiyor"). Artık hem kenarda ok var hem tek tuşla ortalanıyor.
  else if (e.code === 'KeyR' && state.mapOpen) { mapRecenter(); sfx.ui(); }
  // M4a: harita KAPALIYKEN R = anomali frekans kodu girişi (harita açıkken R "merkezle" olarak
  // kalır — iki işlev çakışmasın diye kapı `!state.mapOpen`; bkz. Tuzak 43).
  else if (e.code === 'KeyR' && !state.mapOpen && !state.craftOpen) openAnomalyInput();
  if (e.code === 'KeyB') { chatShow(true); chatin.focus(); e.preventDefault(); sfx.ui(); }
  else if (e.code === 'KeyF') toggleTractor();
  // AI'A NOT: KULLANICI İSTEĞİ — "Y'ye basınca YAVAŞ YAVAŞ doldurulabilsin": Y BASILI tutulurken
  // sunucu sürekli doldurur; bırakınca durur (aşağıdaki keyup). Yalnız yıldızın dibinde çalışır.
  // M3e (kullanıcı geri bildirimi: "y ile fuel hala artmıyor"): Y artık AÇ/KAPA (toggle).
  // Neden: "basılı tut" modelinde kısa bir basış yalnız ~0,3 yakıt ekliyordu (5/sn) → oyuncu
  // "hiç dolmuyor" sanıyordu. Tek basış akışı BAŞLATIR, ikinci basış DURDURUR; menzilden çıkmak
  // veya deponun dolması da kendiliğinden durdurur. Karar yine sunucuda (istemci yalnız bildirir).
  else if (e.code === 'KeyY') { if (state.refueling) stopRefuel(); else startRefuel(); }
  else if (e.code === 'KeyP') toggleMute();
  // M2h (KULLANICI İSTEĞİ): E = TARAMA (gemiden dalga), T = KİLİTLENME (fare altındaki nesneye),
  // C = ZANAAT paneli, H = TAMIR SETI, G = YAKIT KUTUSU, J = ISARET FISEGI.
  // NOT: Sohbet tuşu T'den B'ye taşındı — kullanıcı kilidi T'ye istedi, T çakışırdı.
  else if (e.code === 'KeyE') doScan();
  else if (e.code === 'KeyT') toggleLock();
  else if (e.code === 'KeyC') toggleCraft();
  else if (e.code === 'KeyH') useItem(ITEMS.REPAIRKIT);
  else if (e.code === 'KeyG') useItem(ITEMS.FUELCAN);
  else if (e.code === 'KeyJ') useItem(ITEMS.BEACON);
  else if (state.craftOpen && /^Digit[1-4]$/.test(e.code)) { craftByIndex(Number(e.code.slice(5)) - 1); }
  else if (e.code === 'Escape' && state.craftOpen) { toggleCraft(false); sfx.ui(); }
  else if (e.code === 'Space') e.preventDefault();   // sayfa kaymasın; ateş ticker'da işlenir
});
// M2h: Shift = BOOST. Basılı tutuldukça hız artar ve YAKIT İKİ KAT harcanır (kullanıcı isteği:
// "shifte basılı tutarak daha hızlı gitsin gemi ama iki kat yakıt harcasın"). Bayrak hem yerel
// hız tavanını hem sunucuya giden `mv` paketini etkiler — sunucu aynı çarpanı uygular.

// M2e: YAKIT DOLUMU — Y basılı tutulurken sunucu YAVAŞ YAVAŞ doldurur (kullanıcı isteği:
// "sadece yıldızın dibindeyken Y'ye basınca yavaş yavaş doldurulabilsin"). İstemci yalnız
// başlat/durdur bildirir; miktarı ve kapıları (mesafe/depo) SUNUCU uygular. Erken uyarı
// için mesafe kontrolü burada da yapılır: gereksiz paket ve yanlış beklenti oluşmasın.
// AI'A NOT (M3c — KULLANICI DÜZELTMESİ): yakıt YILDIZDAN çekilir, malzeme HARCANMAZ. Bu yüzden
// istemcide "DOTERYUM var mı" ön kontrolü KALDIRILDI — yakıtı yıldız verir, envanteri değil.
function startRefuel() {
  if (state.mapOpen || chatOpen || state.refueling || !starmap) return;
  const d = Math.hypot(state.me.x, state.me.y);
  if (d > REFUEL_RANGE) {
    logLine(t('refuel_far', { d: Math.round(d), range: REFUEL_RANGE }), 'warn');
    sfx.alarm();
    return;
  }
  if (state.fuel >= FUEL_TANK - 0.01) { logLine(t('refuel_full'), 'warn'); return; }
  state.refueling = true;
  send({ t: 'refuel', on: true });
  sfx.refuel();
}

function stopRefuel() {
  if (!state.refueling) return;
  state.refueling = false;
  send({ t: 'refuel', on: false });
}

function toggleMute() {
  state.muted = !state.muted;
  LSH.set('astrovector.muted', state.muted ? '1' : '0');   // tercih kalıcı (menüdeki MUTE ile aynı bayrak)
  sfx.ensure(); sfx.mute(state.muted);
  logLine(t(state.muted ? 'sound_off' : 'sound_on'));
}
addEventListener('keyup', (e) => {
  keys[e.code] = false;
  // M3e: Y AÇ/KAPA oldu → tuş BIRAKMAK dolumu durdurmaz (bkz. keydown).
});

// Sayfa görünür olduğunda rAF yeniden başlar; ölçek/yerleşim değişmiş olabilir.
