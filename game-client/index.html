// ===========================================================================
// 11) GALAKSİ HARİTASI (M) — KEŞİF PENCERESİ (tüm galaksi DEĞİL)
// ===========================================================================
// TASARIM KURALLARI (hepsi kullanıcı isteğinden):
//  1) SİS — keşfedilmemiş yıldızlar HİÇ çizilmez. Sisteme varınca bulunduğun yıldız ve
//     DETECT_R yarıçapındaki komşuları keşfedilir; liste localStorage'da BİRİKİR → keşif
//     ilerledikçe harita dolar. (Binlerce yıldızın tamamını göstermek keşif hissini öldürür.)
//  2) KÜÇÜK ALAN — harita galaksinin tamamını değil, oyuncunun çevresinde JUMP_RANGE*1.2
//     yarıçaplı küçük bir pencereyi gösterir → yıldızlar ayrık ve okunaklı.
//  3) KONUM — bulunduğun YILDIZ halka ile vurgulanır ve adı yazılır; harita açılışında o
//     yıldız TAM MERKEZDEDİR (kullanıcı isteği).
//  4) MENZİL — en fazla JUMP_RANGE kadar uzağa atlanır. Menzil içi yıldızlar parlak, dışı
//     SOLUK ve TIKLANAMAZ; menzil halkası çizilir. Kesin kararı SUNUCU verir (spoof edilemez).
//  5) PAN — harita WASD/OK ve FARE SÜRÜKLEME ile kaydırılır; ekranın ORTASINDAKİ yıldız
//     seçilidir (ENTER oraya atlar). İMLEÇ YOKTUR (kullanıcı isteği: "imleç değil tüm harita
//     hareket etsin"). Çizim pan sırasında 45ms'de bir yenilenir (throttle).
// AI'A NOT: yıldızlar renk sınıfı başına TEK Graphics + TEK fill ile çizilir; yıldız başına
// ayrı fill yüzlerce geometry bloğu açardı.
let starmap = null, mapStars = [], hoverText = null, mapTitle = null, mapFoot = null;
let mapStarRing = null, mapSelRing = null, mapSelStar = null;
// AI'A NOT: mapBuiltView = son ÇİZİLEN harita merkezi (pan ederken çizimi yenilemek için).
// mapOwn = kendi yıldızımız (menzil halkası ve mesafeler buna göre ölçülür).
const mapBuiltView = { x: 0, y: 0 };
let mapScale = 1;                      // son harita çiziminin ölçeği (fare pan'ı tersine çevirir)
let lastMapBuildAt = 0;                // pan sırasında yeniden çizim zamanı (throttle)
let nextPingAt = 0;                    // sonraki "uzak ping" sesi (atmosfer, rastgele aralık)
let JUMP_RANGE = 700;                  // sunucu 'sn' paketinde günceller — tek gerçek kaynak sunucu
const SEEN_KEY = 'astrovector.seen';
const seen = new Set();                // keşfedilmiş yıldız id'leri (kalıcı)

function loadSeen() {
  try { for (const i of JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')) seen.add(i); } catch { }
}
function saveSeen() {
  try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen])); } catch { }
}
// Sisteme varışta: bulunduğun yıldız + DETECT_R içindeki komşular keşfedilir ve kalıcı yazılır.
function markSeen(starId) {
  if (starId == null || !starmap || !starmap.stars[starId]) return;
  const s0 = starmap.stars[starId];
  const DETECT_R = JUMP_RANGE * 1.5;
  let added = 0;
  for (const s of starmap.stars) {
    if (seen.has(s.i)) continue;
    if (Math.hypot(s.x - s0.x, s.y - s0.y) <= DETECT_R) { seen.add(s.i); added++; }
  }
  if (added) { saveSeen(); logLine(t('discovered', { n: added, seen: seen.size, count: starmap.count })); }
}
// Oyuncunun GALAKSİ konumu = bulunduğu yıldızın konumu + sistem içi yerel konum.
// (Sistem içi koordinatlar yıldıza göre yereldir; haritada mutlak konum gerekir.)
function playerGalaxyPos() {
  if (!starmap || !state.star) return null;
  const s = starmap.stars[state.star.i];
  if (!s) return null;
  return { x: s.x + state.me.x, y: s.y + state.me.y, star: s };
}
function starDist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// AI'A NOT: HARİTA TAZELİĞİ (can yakan hata). Sunucu `/starmap.json` yanıtını bir gün
// cache'liyordu; galaksi 4096 → 16384 yıldıza çıkarılınca tarayıcı ESKİ haritayı kullanmaya devam
// etti. Sonuç: `starmap.stars[state.star.i]` undefined → kendi yıldızımızın galaksi konumu
// bulunamadı → harita oyuncunun yıldızına merkezlenmedi, "SEN" işareti çizilmedi ve warp
// hedefleri sunucudakilerle uyuşmadı ("bulunduğum yıldız ortada değil, atlayamıyorum").
// ÇÖZÜM: snapshot artık `map:{seed,count}` gönderir; istemci elindeki haritayla karşılaştırır.
// Uyuşmazsa harita SÜRÜM SORGU'suyla yeniden çekilir (?v=seed-count → tarayıcı cache'ini atlar).
// Hâlâ uyuşmuyorsa warp KAPATILIR ve durum açıkça yazılır — sessiz arıza yok.
let mapMeta = null;        // sunucunun bildirdiği {seed,count}
let mapStale = false;      // elimizdeki harita sunucununkiyle uyuşmuyor → warp kapalı
let mapRefetching = false; // sonsuz yeniden çekme döngüsünü engeller

function mapMatches() {
  if (!starmap || !mapMeta) return false;
  if (starmap.count !== mapMeta.count || starmap.seed !== mapMeta.seed) return false;
  // AI'A NOT: EK GÜVENCE — sayı/seed aynı olsa bile "kendi yıldızım bu haritada var mı?"
  // sorusunun cevabı asıl kanıttır. Uyuşmazlığın tek görünür belirtisi bu olduğu için
  // (harita merkezlenmiyor, "SEN" yok, warp tutmuyor) kontrolü buraya koyuyoruz.
  if (state.star && !starmap.stars[state.star.i]) return false;
  return true;
}

async function loadMap(force) {
  loadSeen();                                   // keşif geçmişi önce yüklenir
  // AI'A NOT: Sürüm sorgusu CACHE-BUSTER'dır: bayat kopya önbellekten gelmesin diye URL değişir.
  const urls = force && mapMeta ? [`${MAP_URLS[0]}?v=${mapMeta.seed}-${mapMeta.count}`, ...MAP_URLS] : MAP_URLS;
  for (const url of urls) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) continue;
      starmap = await r.json();
      mapStale = mapMeta ? !mapMatches() : false;
      logLine(t('map_loaded', { count: starmap.count, seed: starmap.seed })
        + (mapStale ? ` — ${t('map_stale_refetch', { have: starmap.count, count: mapMeta.count })}` : ''), mapStale ? 'warn' : undefined);
      setStatus(mapStale ? `map ${starmap.count} stars (STALE!)` : `map ${starmap.count} stars`);
      if (state.star) markSeen(state.star.i);    // ilk sisteme varışta çevre keşfedilir
      buildMap();
      return;
    } catch { /* sıradaki URL'yi dene */ }
  }
  logLine(t('map_load_fail'), 'warn');
}

// Uyuşmazlık görülünce çağrılır: haritayı sürüm sorgusuyla bir kez daha çekmeyi dener.
function refreshStaleMap() {
  if (mapRefetching || !mapMeta || !starmap || mapMatches()) return;
  mapRefetching = true;
  logLine(t('map_stale_refetch', { have: starmap.count, count: mapMeta.count }), 'warn');
  loadMap(true).finally(() => {
    mapRefetching = false;
    if (mapMatches()) { mapStale = false; logLine(t('map_refreshed')); }
    else { mapStale = true; logLine(t('map_stale_kept'), 'warn'); }
    if (state.mapOpen) { buildMap(); updateMapHover(); }
  });
}

function buildMap() {
  mapLayer.removeChildren().forEach(c => c.destroy({ children: true }));
  hoverText = mapTitle = mapFoot = mapStarRing = mapSelRing = null;
  if (!starmap) return;
  // AI'A NOT: Harita artık İMLEÇ değil KAYDIRMA (pan) ile gezilir: merkez `state.mapView`'dir
  // ve çizim ona göre yapılır. Harita açılırken merkez = OYUNCUNUN BULUNDUĞU YILDIZ (tam
  // ortada) — kullanıcı isteği. Pan ederken bütün yıldız alanı kayar; çizim 45ms'de bir
  // yenilenir, o yüzden `mapBuiltView` son çizilen merkezi tutar.
  mapBuiltView.x = state.mapView.x; mapBuiltView.y = state.mapView.y;
  const V = state.mapView, OWN = state.mapOwn;

  const box = new PIXI.Graphics();
  box.rect(0, 0, VW, VH).fill({ color: 0x03040c, alpha: 0.96 });
  mapLayer.addChild(box);

  const cx = Math.round(VW / 2), cy = Math.round(VH / 2);
  const VIEW_R = JUMP_RANGE * 1.2;                       // gösterilen yarıçap — KÜÇÜK alan
  const scale = Math.min(VW - 30, VH - 48) / (VIEW_R * 2);
  mapScale = scale;                                      // fare pan'ı için (piksel → birim)
  const scr = (x, y) => [cx + (x - V.x) * scale, cy + (y - V.y) * scale];
  const starScr = OWN && OWN.star ? scr(OWN.star.x, OWN.star.y) : [cx, cy];

  // (a) Menzil halkası KENDİ YILDIZIMIZIN çevresinde (gidebileceğimiz alan) + pencere kenarı
  const rings = new PIXI.Graphics();
  rings.circle(starScr[0], starScr[1], JUMP_RANGE * scale).stroke({ width: 1, color: 0x27543f });
  rings.circle(cx, cy, VIEW_R * scale).stroke({ width: 1, color: 0x101c26 });
  mapLayer.addChild(rings);

  // (b) Yalnız KEŞFEDİLMİŞ yıldızlar; menzil içi parlak, menzil dışı soluk.
  // AI'A NOT: pencere + %35 PAY taranır: pan sırasında kenarda boş bant oluşmasın diye
  // kadraj dışındaki yıldızlar da çizilir (tuval kırpar), ama TIKLANABİLİR liste yalnız
  // EKRANDAKİLERİ içerir.
  const bright = new Map();     // renk sınıfı → [x, y, boyut, anomali?]
  const dim = [];
  mapStars = [];
  const BUILD_R = VIEW_R * 1.35;
  for (const s of starmap.stars) {
    if (!seen.has(s.i)) continue;                        // SİS: keşfedilmemiş görünmez
    if (Math.abs(s.x - V.x) > BUILD_R || Math.abs(s.y - V.y) > BUILD_R) continue;
    const sx = Math.round(scr(s.x, s.y)[0]);
    const sy = Math.round(scr(s.x, s.y)[1]);
    const onScreen = sx >= 3 && sx <= VW - 4 && sy >= 14 && sy <= VH - 16;
    const inRange = OWN && OWN.star ? starDist(s, OWN.star) <= JUMP_RANGE : false;
    const sz = s.a ? 3 : 2;
    if (inRange) {
      if (!bright.has(s.c)) bright.set(s.c, []);
      bright.get(s.c).push([sx, sy, sz, !!s.a]);
    } else if (onScreen) {
      dim.push([sx, sy]);
    }
    if (onScreen) mapStars.push([s.i, sx, sy, inRange]);
  }
  for (const [c, list] of bright) {
    // AI'A NOT: anomaliler ve normal yıldızlar ayrı Graphics'te — anomali HER ZAMAN mor
    // (footer'da açıklanır), normal yıldız sınıf renginde.
    const gN = new PIXI.Graphics(), gA = new PIXI.Graphics();
    let anyN = false, anyA = false;
    for (const [x, y, sz, isA] of list) {
      if (isA) { gA.rect(x, y, sz, sz); anyA = true; } else { gN.rect(x, y, sz, sz); anyN = true; }
    }
    if (anyN) { gN.fill(P.starC[c] ?? 0xffffff); mapLayer.addChild(gN); }
    if (anyA) { gA.fill(0xc08cff); mapLayer.addChild(gA); }
  }
  if (dim.length) {
    const g = new PIXI.Graphics();
    for (const [x, y] of dim) g.rect(x, y, 1, 1);
    g.fill(0x27333f);
    mapLayer.addChild(g);
  }

  // (c) KENDİ YILDIZIMIZ — ÇİZİM SIRASI (d)'den SONRA, aşağıdaki blokta yapılır.

  // (d) SEÇİLİ HEDEF = EKRANIN ORTASINDAKİ YILDIZ. İmleç YOKTUR (kullanıcı isteği: "imleç
  // değil tüm harita hareket etsin") — harita kayar, ortadaki yıldız halkalanır, ENTER atlar.
  const sel = nearestStar(cx, cy, 22);
  mapSelRing = new PIXI.Graphics();
  mapSelStar = sel;
  if (sel != null) {
    const sx2 = mapStars[sel][1], sy2 = mapStars[sel][2];
    mapSelRing.circle(sx2, sy2, 6).stroke({ width: 1, color: 0x8fe0c0 });
    mapSelRing.circle(sx2, sy2, 10).stroke({ width: 1, color: 0x2f6f5a });
  }
  mapLayer.addChild(mapSelRing);

  // (d2) KENDİ YILDIZIMIZ — HER ZAMAN GÖRÜNÜR.
  // AI'A NOT (kullanıcı geri bildirimi: "harita benim olduğum yıldızı göstermiyor"):
  // Eskiden işaret yalnız yıldız EKRANDA ve `seen` kümesinde olduğunda çiziliyordu; WASD ile
  // pencere dışına kaydırılınca oyuncunun yeri tamamen kaybolurdu (harita 840 birimlik pencere,
  // kendi yıldızı bir tuş basışında kenar dışına çıkabiliyor). Yeni kural iki durumlu:
  //   ekranda  → parlak nokta + nişangâh çentikleri + halka (seçim halkasının ÜSTÜNE çizilir)
  //   ekran dışında → kenara yapışık OK + "SEN" etiketi (yıldızın yönü her zaman belli)
  // Seçim işareti merkezdeyken üst üste bineceği için kendi işaretimiz EN SON eklenir.
  mapStarRing = new PIXI.Graphics();
  const ownOn = starScr[0] >= 6 && starScr[0] <= VW - 7 && starScr[1] >= 16 && starScr[1] <= VH - 18;
  let ownEdge = null;
  if (OWN && OWN.star) {
    if (ownOn) {
      const ox = Math.round(starScr[0]), oy = Math.round(starScr[1]);
      mapStarRing.rect(ox - 1, oy - 1, 3, 3).fill(P.hullLite);              // nokta (parlak)
      mapStarRing.circle(ox, oy, 4).stroke({ width: 1, color: P.cockpit }); // iç halka
      mapStarRing.circle(ox, oy, 8).stroke({ width: 1, color: P.cockpit }); // dış halka
      for (const [dx, dy] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) {          // nişangâh çentikleri
        mapStarRing.rect(ox + dx * 11 - (dy ? 0 : 0), oy + dy * 11, dy ? 3 : 1, dy ? 1 : 3).fill(P.cockpit);
      }
    } else {
      // Ekran dışı: merkezden yıldıza giden yönü kenara kırp.
      const vx = starScr[0] - cx, vy = starScr[1] - cy;
      const mx = (VW / 2 - 14) / Math.max(1, Math.abs(vx)), my = (VH / 2 - 20) / Math.max(1, Math.abs(vy));
      const k = Math.min(mx, my);
      const ex = Math.round(cx + vx * k), ey = Math.round(cy + vy * k);
      const ang = Math.atan2(vy, vx);
      mapStarRing.rect(ex - 1, ey - 1, 3, 3).fill(P.hullLite);
      // 7x7 üçgen ok (yıldızın yönünü gösterir) — piksel izgara üzerinde, yumuşatma yok.
      for (let r = 0; r < 4; r++) {
        const half = r;                                     // taban genişler
        for (let c = -half; c <= half; c++) {
          const px = Math.round(ex + Math.cos(ang) * (r - 2) - Math.sin(ang) * c);
          const py = Math.round(ey + Math.sin(ang) * (r - 2) + Math.cos(ang) * c);
          mapStarRing.rect(px, py, 1, 1);
        }
      }
      mapStarRing.fill(P.cockpit);
      ownEdge = [Math.max(4, Math.min(ex, VW - 4)), Math.max(16, Math.min(ey, VH - 18))];
    }
  }
  mapLayer.addChild(mapStarRing);

  // (e) ETİKETLER — ÇAKIŞMA ÖNLEYİCİ YERLEŞTİRME
  // AI'A NOT: Etiketler spiral kolda üst üste binip okunamaz hale geliyordu ("SEN: SERUM" ile
  // komşu yıldız adları aynı pikselde). Çözüm: her etiket için dikdörtgen yer tahsis edilir,
  // ÇAKIŞAN ETİKET ATLANIR (greedy). Önce OYUNCUNUN KENDİ YILDIZI yerleştirilir (en önemli
  // bilgi), sonra merkeze yakınlık sırasına göre komşular.
  const placed = [];
  const fits = (x, y, w, h) => !placed.some(r => !(x + w < r.x || x > r.x + r.w || y + h < r.y || y > r.y + r.h));
  function putLabel(txt, sx, sy, color, preferBelow) {
    const w = txt.length * (GLIF_G + HARF_ARA), h = GLIF_Y + 2;
    // İki aday konum: (a) yıldızın üstünde-sağında, (b) altında/ortasında. Çakışanı atla.
    const cands = preferBelow
      ? [[sx - w / 2, sy + 10], [sx + 5, sy - 10], [sx - w / 2, sy - 10]]
      : [[sx + 5, sy - 10], [sx - w / 2, sy + 10], [sx + 5, sy + 10]];
    for (const [cxp, cyp] of cands) {
      const x = Math.max(3, Math.min(cxp, VW - w - 3));
      const y = Math.max(14, Math.min(cyp, VH - 20));
      if (!fits(x, y, w, h)) continue;
      const lb = new BitmapText(w + 2, 10, color);
      lb.set(txt);
      lb.sprite.x = Math.round(x); lb.sprite.y = Math.round(y);
      mapLayer.addChild(lb.sprite);
      placed.push({ x, y, w, h });
      return true;
    }
    return false;   // yer bulunamadı → etiket hiç çizilmez (okunamaz yığın olmasın)
  }
  // AI'A NOT: "SEN" etiketi artık `mapStars` listesine BAĞLI DEĞİL. O liste yalnız EKRANDAKİ
  // KEŞFEDİLMİŞ yıldızları içerir; kendi yıldızımız listeden düşerse (pencere dışına kayınca)
  // etiket de kayboluyordu. Artık konum doğrudan `starScr`'den geliyor ve ekran dışı durumda
  // kenar okuyla birlikte kısa "SEN" etiketi yazılıyor.
  if (OWN && OWN.star) {
    if (ownEdge) {
      const lb = new BitmapText(120, 10, P.cockpit);
      lb.set(t('label_you_short'));
      lb.sprite.x = Math.round(Math.max(3, Math.min(ownEdge[0] + 7, VW - 4 - lb.width)));
      lb.sprite.y = Math.round(Math.max(12, Math.min(ownEdge[1] - 4, VH - 20)));
      mapLayer.addChild(lb.sprite);
    } else {
      putLabel(t('map_you', { star: OWN.star.n }), Math.round(starScr[0]), Math.round(starScr[1]), P.hullLite, true);
    }
  }
  const near = mapStars
    .filter(e => !(state.star && e[0] === state.star.i))
    .sort((a, b) => Math.hypot(a[1] - cx, a[2] - cy) - Math.hypot(b[1] - cx, b[2] - cy))
    .slice(0, 10);
  for (const [id, sx, sy] of near) {
    const s = starmap.stars[id];
    const d = OWN && OWN.star ? Math.round(starDist(s, OWN.star)) : 0;
    putLabel(`${s.n} ${d}`, sx, sy, s.a ? 0xc08cff : P.uiDim, false);
  }

  // (f) Metinler (bitmap font — keskin)
  mapTitle = new BitmapText(700, 10, P.ui);
  mapTitle.set(t('map_title', { seen: seen.size, count: starmap.count, range: JUMP_RANGE }));
  mapTitle.sprite.x = 6; mapTitle.sprite.y = 4;
  mapLayer.addChild(mapTitle.sprite);

  hoverText = new BitmapText(700, 10, 0xc8a8ff);
  hoverText.set('');
  hoverText.sprite.x = 6; hoverText.sprite.y = 14;
  mapLayer.addChild(hoverText.sprite);

  mapFoot = new BitmapText(700, 10, P.uiDim);
  mapFoot.set(t('map_foot', { star: state.star ? state.star.n : '?' }));
  mapFoot.sprite.x = 6; mapFoot.sprite.y = VH - 12;
  mapLayer.addChild(mapFoot.sprite);

  // Katman kurulduktan sonra durumu TEK KAYNAKTAN uygula (dosya başı kural 3).
  mapLayer.visible = state.mapOpen;
}

function toggleMap() {
  if (!starmap) { logLine(t('map_not_loaded'), 'warn'); return; }
  // Uyuşmazlık varsa haritayı tazelemeyi dene ve kullanıcıyı uyar (sessiz arıza olmasın).
  if (!mapMatches()) { refreshStaleMap(); logLine(t('map_mismatch'), 'warn'); }
  state.mapOpen = !state.mapOpen;
  if (state.mapOpen) {
    // AI'A NOT: (1) GEMİYİ DURDUR — harita modunda itiş girdisi kapalıdır; hız sıfırlanmazsa
    //     gemi arkada sürüklenmeye devam eder. (2) MERKEZ = KENDİ YILDIZIMIZ: kullanıcı
    //     isteği "tam oyuncunun bulunduğu yıldız ortada olsun" — gemi sistem içinde nerede
    //     olursa olsun harita yıldızı merkeze alır (gemi konumu değil).
    state.me.vx = 0; state.me.vy = 0;
    const g = playerGalaxyPos();
    state.mapOwn = g ? { x: g.star.x, y: g.star.y, star: g.star } : { x: 0, y: 0, star: null };
    state.mapView = { x: state.mapOwn.x, y: state.mapOwn.y };
    buildMap();
    updateMapHover();
  }
  mapLayer.visible = state.mapOpen;
  logLine(state.mapOpen
    ? t('map_open_log', { range: JUMP_RANGE })
    : t('map_close_log'));
}

// AI'A NOT: Ortak warp yolu — fare tıklaması ve ENTER aynı yerden geçer; menzil ve YAKIT
// kuralı TEK yerde. Sunucu yine de doğrular (istemci kararı bağlayıcı değildir).
function doWarpTo(id, inRange) {
  // AI'A NOT: BAYAT HARİTA KAPISI. Harita sunucununkiyle uyuşmuyorsa yıldız kimlikleri ve
  // konumlar farklı dünyaya aittir → istek sunucuda reddedilir ve oyuncu "atlayamıyorum" der.
  // Sessizce yutmak yerine nedenini yazıp warp'ı kapatıyoruz.
  if (starmap && mapMeta && !mapMatches()) {
    logLine(t('map_stale_warp_off'), 'warn');
    sfx.alarm();
    return;
  }
  const star = starmap.stars[id];
  if (id === (state.star ? state.star.i : -1)) { logLine(t('warp_same')); return; }
  if (!inRange) {
    const d = state.mapOwn.star ? Math.round(starDist(star, state.mapOwn.star)) : 0;
    logLine(t('warp_range', { star: star.n, d, max: JUMP_RANGE }), 'warn');
    return;
  }
  // M2h: warp artık YAKIT değil WARP HUCRESI ister (3 DOTERYUM → 1 hücre, C paneli).
  if ((state.cargo[ITEMS.WARPCELL] || 0) < 1) {
    logLine(t('warp_nocell', { need: 3, ore: FUEL_MATERIAL, item: ITEMS.WARPCELL }), 'warn');
    sfx.alarm();
    return;
  }
  send({ t: 'warp', starId: id });
  logLine(t('warp_request', { star: star.n }));
  toggleMap();
}

// EKRANIN ORTASINDAKİ yıldıza atla (ENTER). İmleç yok — merkez neyse hedef odur.
function warpToCenter() {
  if (!state.mapOpen) return;
  if (mapSelStar == null) { logLine(t('warp_no_center')); return; }
  doWarpTo(mapStars[mapSelStar][0], mapStars[mapSelStar][3]);
}

// HARİTAYI KENDİ YILDIZIMA ORTALA (R) — pan ile uzaklaşınca "neredeyim" sorusu tek tuşla çözülür.
function mapRecenter() {
  if (!state.mapOpen) return;
  state.mapView.x = state.mapOwn.x; state.mapView.y = state.mapOwn.y;
  lastMapBuildAt = 0;                    // throttle'ı sıfırla → anında yeniden çizilir
  buildMap();
  updateMapHover();
  logLine(t('recentered', { star: state.star ? state.star.n : '?' }));
}

// Merkezdeki yıldızın bilgisi (mesafe + menzil durumu) üst satıra yazılır.
function updateMapHover() {
  if (!hoverText || !starmap) return;
  if (mapSelStar == null) { hoverText.set(t('map_hover_none')); return; }
  const [id, , , inRange] = mapStars[mapSelStar];
  const s = starmap.stars[id];
  const d = state.mapOwn.star ? Math.round(starDist(s, state.mapOwn.star)) : 0;
  hoverText.set(t('map_hover', { n: s.n, k: s.k, p: s.p, d, inRange }) + (s.a ? '  ! ' + s.a : ''));
}

// (İmleç çizimi KALDIRILDI — harita pan ile gezilir, seçim merkezdeki yıldızdır.)

// AI'A NOT: HARİTA FARE KONTROLÜ. Sürükle = PAN (tüm harita kayar), tıkla = WARP.
// Ayrım: sürükleme mesafesi 4 pikseli geçtiyse tıklama sayılmaz (harita gezerken
// kazara warp yapılmasın). Eski "fare imleci taşır" davranışı kaldırıldı — kullanıcı
// isteği: imleç değil HARİTANIN KENDİSİ hareket eder.
let mapDrag = null;
app.canvas.addEventListener('mousedown', (ev) => {
  if (ev.button !== 0) return;
  // M2g: MENÜ tıklamayı TÜKETİR (dil düğmeleri / ses kaydırıcısı / MUTE / aç-kapat) — bu yüzden
  // ateş etmeden ÖNCE sorulur. Menü açıkken panelin dışına tıklamak menüyü kapatır (warp/ateş yok).
  // M2h: ZANAAT paneli de tıklamayı tüketir (satıra tıkla = üret).
  // M3b (KULLANICI İSTEĞİ): "envanter ve craftingi birleştir" → eşya satırları artık PANELİN
  // İÇİNDE. Bu yüzden envanter tıklaması zanaat panelinden ÖNCE sorulur: panelin içindeki eşya
  // satırı = KULLAN, panelin başka yeri = üret/kapat. (Önceden HUD'daki çipe bakıyordu.)
  {
    const m0 = ekranToSanal(ev);
    for (const r of state.invHits) {
      if (m0.mx >= r.x && m0.mx <= r.x + r.w && m0.my >= r.y && m0.my <= r.y + r.h) {
        useItem(r.id, true);              // panelden kullanım: açık panel engel değil
        return;
      }
    }
  }
  // M2g/M2h: MENÜ ve ZANAAT paneli tıklamayı TÜKETİR (dil düğmeleri / ses / satıra tıkla = üret).
  // Panelin dışına tıklamak paneli kapatır (warp/ateş olmaz).
  if (craftHitClick(ekranToSanal(ev).mx, ekranToSanal(ev).my)) return;
  if (menuHitClick(ekranToSanal(ev).mx, ekranToSanal(ev).my)) return;
  // Harita KAPALI → sol tık = TIKLANAN NOKTAYA ateş (kullanıcı isteği: "mouse ile basılan yere
  // ateş etsin"). Açı, gemi → tıklanan dünya noktası vektöründen hesaplanır.
  if (!state.mapOpen) {
    if (!chatOpen) {
      const w = ekranToDunya(ev);
      state.aim = w;
      tryFire(performance.now());
    }
    return;
  }
  const { mx, my } = ekranToSanal(ev);
  mapDrag = { mx, my, moved: 0, sx: ev.clientX, sy: ev.clientY };
});
addEventListener('mousemove', (ev) => {
  // M2g: MENÜ — kaydırıcı sürükleniyorsa ses seviyesi fareyi izler; düğme üzerine gelince parlar.
  {
    const p = ekranToSanal(ev);
    MENU.hover = inRect(MENU.btn, p.mx, p.my);
    if (MENU.drag && MENU.open) volumeFromX(p.mx);
  }
  // M2e: NİŞAN — harita kapalıyken fare dünya noktasını takip eder; ateş (tık/SPACE) bu yöne
  // gider. Harita ya da MENÜ açıkken nişan güncellenmez (orada fare pan/warp/menü aracıdır).
  if (!state.mapOpen && !chatOpen && !MENU.open) state.aim = ekranToDunya(ev);
  if (!mapDrag || !state.mapOpen) return;
  const dx = (ev.clientX - mapDrag.sx) / SCALE, dy = (ev.clientY - mapDrag.sy) / SCALE;
  mapDrag.sx = ev.clientX; mapDrag.sy = ev.clientY;
  mapDrag.moved += Math.hypot(dx, dy);
  if (mapDrag.moved < 1) return;
  const inv = mapScale > 0 ? 1 / mapScale : 0;      // piksel → galaksi birimi
  state.mapView.x -= dx * inv;                      // haritayı sürükle: merkez TERS yönde kayar
  state.mapView.y -= dy * inv;
  buildMap();
});
addEventListener('mouseup', (ev) => {
  if (MENU.drag) { MENU.drag = false; return; }        // M2g: kaydırıcı bırakıldı
  if (!mapDrag || !state.mapOpen) { mapDrag = null; return; }
  const wasClick = mapDrag.moved < 4;
  const { mx, my } = ekranToSanal(ev);
  mapDrag = null;
  if (!wasClick) return;                            // sürüklemeydi → warp yok
  const best = nearestStar(mx, my, 9);
  if (best == null) return;
  doWarpTo(mapStars[best][0], mapStars[best][3]);
});

// Ekran (CSS px) → sanal piksel dönüşümü. Ölçek SCALE olduğu için bölme yeterli.
function ekranToSanal(ev) {
  const rect = app.canvas.getBoundingClientRect();
  return { mx: (ev.clientX - rect.left) / SCALE, my: (ev.clientY - rect.top) / SCALE };
}

// Sanal piksel → DÜNYA koordinatı (kamera merkezli). Nişan/ateş yönü için gerekir.
function ekranToDunya(ev) {
  const { mx, my } = ekranToSanal(ev);
  return { x: state.cam.x + (mx - VW / 2), y: state.cam.y + (my - VH / 2) };
}

// mapStars girdisi: [yildizId, ekranX, ekranY, menzilIcinde]
function nearestStar(mx, my, maxDist) {
  let best = null, bestD = maxDist;
  for (let k = 0; k < mapStars.length; k++) {
    const st = mapStars[k];
    const d = Math.hypot(st[1] - mx, st[2] - my);
    if (d < bestD) { bestD = d; best = k; }
  }
  return best;
}

function mkMenuText(maxW, col) {
  const b = new BitmapText(maxW, 10, col);

const mBtn = mkMenuText(90, P.uiDim);

const mEn = mkMenuText(120, P.ui);

// M2i (KULLANICI İSTEĞİ): "tuşları menüde göstersin ekranda hep değil" → kontrol listesi menüye
// taşındı. HUD'daki sürekli ipucu satırı kaldırıldı; tuşlar artık yalnız MENÜ panelinde (4 satır).
const mKeys = mkMenuText(200, P.uiDim);
const mKeyRows = [mkMenuText(320, P.uiDim), mkMenuText(320, P.uiDim), mkMenuText(320, P.uiDim), mkMenuText(320, P.uiDim)];

const mFoot = mkMenuText(330, P.uiDim);
const PANEL_TEXTS = [mTitle, mLang, mEn, mTr, mVol, mVolVal, mMute, mMuteVal, mKeys, ...mKeyRows, mFoot];

function menuLayout() {
  // AI'A NOT: ÖLÇEK DERSİ — panel sabit 336 px iken ÖNİZLEME PANELİNDE sanal genişlik ~330 px
  // olduğu için sol sütun (etiketler) EKRAN DIŞINA taştı: yalnız sağdaki düğmeler görünüyordu.
  // Panel artık ekrana SIĞAR (VW-20) ve kontrol kolonu panel genişliğine göre ölçeklenir.
  const pw = Math.min(340, Math.max(210, VW - 20));
  const ph = 196;                                  // M2i: +54 px → MENÜ'ye kontrol listesi girdi
  const px = Math.round((VW - pw) / 2), py = Math.round((VH - ph) / 2);
  MENU.btn = { x: VW - 66, y: VH - 16, w: 60, h: 12 };
  MENU.panel = { x: px, y: py, w: pw, h: ph };
  const cw = Math.min(100, Math.round(pw * 0.32)), cx = px + pw - 10 - cw;
  MENU.en = { x: cx, y: py + 30, w: cw, h: 13 };
  MENU.tr = { x: cx, y: py + 48, w: cw, h: 13 };
  MENU.track = { x: cx, y: py + 76, w: cw - 28, h: 9 };
  MENU.mute = { x: cx, y: py + 94, w: cw, h: 13 };
  MENU.keysY = py + 118;                           // M2i: kontrol listesi başlangıcı
  return { px, py, pw, ph };
}
const inRect = (r, x, y) => !!r && x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function toggleMenu(force) {
  MENU.open = force === undefined ? !MENU.open : !!force;
  MENU.drag = false;
  if (MENU.open) { sfx.ensure(); sfx.ui(); }
  applyLang();
}
// DİL DEĞİŞİMİNDE yalnız DOM metinleri elle güncellenir; canvas metinleri her karede `set()`
// ile yeniden kurulur (BitmapText içerik değişmediyse çizmez → ek maliyet yok).
function applyLang() {
  if (chatin) chatUI();          // M3: sohbet rozeti + kanal ipucu da dile uyar
}
function volumeFromX(mx) {
  const tr = MENU.track;
  setVolume((mx - tr.x) / tr.w);
}
// Dönüş: true → tıklama TÜKETİLDİ (ateş etme). false → oyunun normal tıklaması işlenir.
function menuHitClick(mx, my) {
  menuLayout();
  if (inRect(MENU.btn, mx, my)) { toggleMenu(); return true; }
  if (!MENU.open) return false;
  if (!inRect(MENU.panel, mx, my)) { toggleMenu(false); sfx.ui(); return true; }   // dışına tıkla = kapat
  if (inRect(MENU.en, mx, my)) { setLang('en'); applyLang(); sfx.ui(); return true; }
  if (inRect(MENU.tr, mx, my)) { setLang('tr'); applyLang(); sfx.ui(); return true; }
  if (inRect(MENU.mute, mx, my)) { toggleMute(); return true; }
  const tr = MENU.track;
  if (mx >= tr.x - 6 && mx <= tr.x + tr.w + 6 && my >= tr.y - 6 && my <= tr.y + tr.h + 6) {
    sfx.ensure(); MENU.drag = true; volumeFromX(mx); return true;   // kaydırmalı ses ayarı başladı
  }
  return true;                                    // panel içi boşluk: tıklama tüketilir
}

function drawMenu() {
  menuLayout();
  menuG.clear();
  // --- MENU düğmesi (her zaman görünür) ---
  const b = MENU.btn;
  const act = MENU.hover || MENU.open;
  menuG.rect(b.x, b.y, b.w, b.h).fill({ color: 0x04060f, alpha: 0.75 });
  menuG.rect(b.x, b.y, b.w, b.h).stroke({ width: 1, color: act ? P.engine : P.uiDim });
  mBtn.set(t('menu_btn'), act ? P.engine : P.uiDim);
  mBtn.sprite.x = Math.round(b.x + (b.w - mBtn.width) / 2);
  mBtn.sprite.y = b.y + 3;
  mBtn.sprite.visible = true;
  if (!MENU.open) { for (const o of PANEL_TEXTS) o.sprite.visible = false; return; }

  // AI'A NOT: TUZAK (yaşandı) — `MENU.panel` alanları x/y/w/h'tir; `const { px, py, pw, ph } =
  // MENU.panel` yazmak dördünü de `undefined` yapar (destructure SESSİZCE undefined verir), bu
  // yüzden panel zemini ve SOL SÜTUN etiketleri hiç çizilmedi ama sağdaki düğmeler (MENU.en.x
  // gibi doğrudan alan okumaları) çizildi → "menünün yarısı yok" görüntüsü. Adları eşleştir.
  const { x: px, y: py, w: pw, h: ph } = MENU.panel;
  // AI'A NOT: zemin 0x060b16 @.96 + PARLAK çerçeve (P.navyLite) + iç ince çizgi. Önceki sürümde
  // zemin uzayın siyahına karışıyordu ve panel "yok" gibi görünüyordu (yalnız düğmeler vardı).
  menuG.rect(px, py, pw, ph).fill({ color: 0x060b16, alpha: 0.96 });
  menuG.rect(px, py, pw, ph).stroke({ width: 1, color: P.navyLite });
  menuG.rect(px + 3, py + 3, pw - 6, ph - 6).stroke({ width: 1, color: 0x12233a });
  const put = (o, txt, col, x, y) => { o.set(txt, col); o.sprite.x = x; o.sprite.y = y; o.sprite.visible = true; };

  put(mTitle, t('menu_title'), P.ui, px + 12, py + 10);
  put(mLang, t('menu_lang'), P.uiDim, px + 12, py + 34);

  // Dil düğmeleri. 'ENGLISH' / 'TÜRKÇE' etiketleri HER İKİ dilde aynı yazılır (kullanıcı kendi
  // dilini tanısın); aktif olan çerçeve + parlak metinle işaretlenir.
  for (const [r, code] of [[MENU.en, 'en'], [MENU.tr, 'tr']]) {
    const on = LANG === code;
    menuG.rect(r.x, r.y, r.w, r.h).fill({ color: on ? 0x14304a : 0x080c16, alpha: 0.9 });
    menuG.rect(r.x, r.y, r.w, r.h).stroke({ width: 1, color: on ? P.engine : P.uiDim });
  }
  put(mEn, 'ENGLISH', LANG === 'en' ? P.hullLite : P.uiDim, MENU.en.x + Math.round((MENU.en.w - mEn.width) / 2), MENU.en.y + 3);
  put(mTr, 'TÜRKÇE', LANG === 'tr' ? P.hullLite : P.uiDim, MENU.tr.x + Math.round((MENU.tr.w - mTr.width) / 2), MENU.tr.y + 3);

  // Kaydırmalı ses ayarı: raya tıkla/sürükle → seviye (0..100%). Topuz ray üzerinde kayar.
  put(mVol, t('menu_vol'), P.uiDim, px + 12, py + 76);
  const tr = MENU.track;
  menuG.rect(tr.x, tr.y, tr.w, tr.h).fill({ color: 0x0a1622, alpha: 0.95 });
  menuG.rect(tr.x, tr.y, tr.w, tr.h).stroke({ width: 1, color: P.uiDim });
  const fillW = Math.round(tr.w * VOLUME);
  if (fillW > 0) menuG.rect(tr.x + 1, tr.y + 1, Math.max(0, fillW - 1), tr.h - 2).fill({ color: P.navyLite, alpha: 0.9 });
  menuG.rect(tr.x + fillW - 1, tr.y - 2, 3, tr.h + 4).fill({ color: P.engine });
  put(mVolVal, `${Math.round(VOLUME * 100)}%`, P.ui, tr.x + tr.w + 6, tr.y + 1);

  put(mMute, t('menu_mute'), P.uiDim, px + 12, py + 96);
  const mb = MENU.mute, mOn = state.muted;
  menuG.rect(mb.x, mb.y, mb.w, mb.h).fill({ color: mOn ? 0x2a0f14 : 0x0b2016, alpha: 0.9 });
  menuG.rect(mb.x, mb.y, mb.w, mb.h).stroke({ width: 1, color: mOn ? P.warn : P.uiDim });
  // Düğme SUSTURMA DURUMUNU yazar ("MUTE OFF" = ses açık). Aksiyon değil DURUM gösterilir; yoksa
  // "MUTE ON" yazısı sesin kapalı olduğunu düşündürürdü (kullanıcı yanlış okur).
  put(mMuteVal, t(mOn ? 'menu_on' : 'menu_off'), mOn ? P.warn : P.ui, mb.x + Math.round((mb.w - mMuteVal.width) / 2), mb.y + 3);

  // M2i: KONTROL LİSTESİ (kullanıcı isteği: "tuşları menüde göstersin, ekranda hep değil").
  menuG.rect(px + 8, MENU.keysY - 4, pw - 16, 56).fill({ color: 0x080d18, alpha: 0.8 });
  menuG.rect(px + 8, MENU.keysY - 4, pw - 16, 56).stroke({ width: 1, color: 0x1b2c40 });
  put(mKeys, t('menu_keys'), P.navyLite, px + 14, MENU.keysY + 2);
  mKeyRows.forEach((o, i) => put(o, t('key_row_' + (i + 1)), P.uiDim, px + 14, MENU.keysY + 16 + i * 11));

  put(mFoot, t('menu_foot'), P.uiDim, px + 12, py + ph - 18);
}

// 12.6) M2h — TARAMA (E) · KİLİTLENME (T) · ZANAAT (C) · EŞYA KULLANIMI (H/G/J)
// ===========================================================================
// AI'A NOT (KULLANICI İSTEKLERİ, birebir):
//  * "scan tuşu olsun gemiden etrafa bi dalga yayılsın odada ne varsa göstersin ama menzili olsun
//    iki ekran kadar" → E: gemiden büyüyen dalga; menzil = sanal ekranın büyük kenarının 2 katı.
//  * "kilitlenme tuşu olsun mouse bişeyin üstündeyken örneğin T'ye basınca kilitlensin ateş atınca
//    sadece ona atsın" → T: fare altındaki nesneye kilit; kilitliyken nişan HER KARE hedefe yazılır
//    (hedef kaçsa da nişan onu izler) → ateş yalnız ona gider.
//  * "shifte basılı tutarak daha hızlı gitsin gemi ama iki kat yakıt harcasın" → 13.1 (boost).
//  * "oyunda crafting olacak bi işe yaramaları lazım; doteryumdan warp fuel yapılsın" → C paneli:
//    tarifeler sunucudan gelir, üretim/harcama SUNUCUDA doğrulanır (istemci sadece ister).
// Katmanlar: dalga + işaret halkaları `world` içinde (kamerayla kayar), kenar okları `hudLayer`da.
const scanFx = new PIXI.Graphics();       // dünya uzayı: dalga halkası + nesne işaretleri
world.addChild(scanFx);
const scanHudFx = new PIXI.Graphics();    // ekran uzayı: ekran dışı nesneler için kenar okları
hudLayer.addChild(scanHudFx);
const lockFx = new PIXI.Graphics();       // dünya uzayı: kilit çerçevesi + gemi→hedef çizgisi
world.addChild(lockFx);
let lockText = null;
if (!lockText) {
  lockText = new BitmapText(240, 10, P.warn);   // M2h: "LOCK <ad> <mesafe> — MENZIL DISI" sığsın
  hudLayer.addChild(lockText.sprite);
  lockText.sprite.visible = false;

// AI'A NOT: Tarama menzili EKRAN cinsinden (sabit birim değil): sanal çözünürlük ekrana bağlı
// olduğu için "iki ekran" ancak böyle her pencerede iki ekran kalır.
const scanRange = () => Math.round(SCAN_SCREENS * Math.max(VW, VH));
const beaconActive = () => performance.now() < state.beaconUntil;

// Nesne listesi: tarama, kilit ve kenar okları AYNI kaynaktan okur (kaya, kapsül, uzak gemi).
// AI'A NOT (HATA DÜZELTMESİ): kapsüllerin konumu `pk.group`ta, KAYALARIN ise `r.g`de tutulur.
// İlk sürümde kapsül için de `p.g` yazılmıştı → kapsül DOĞDUĞU an (yani kilitli kaya patlayınca)
// `p.g.x` undefined'dan okunup `TypeError` atıyor, ticker'ın kalanı ölüyor ve oyun DONUYORDU.
// Ders: farklı koleksiyonların alan adları aynı sanılmamalı (bkz. Tuzak 35/45) + savunmacı süzme:
// alan eksikse nesne listeden DÜŞER, oyun çökmez.
function roomObjects() {
  const out = [];
  for (const [id, r] of rocks) if (r && r.g) out.push({ kind: 'rock', id, x: r.g.x, y: r.g.y, ore: r.ore });
  for (const [id, p] of pickups) {
    const g = p && (p.group || p.g);
    if (g) out.push({ kind: 'pickup', id, x: g.x, y: g.y, ore: p.ore });
  }
  for (const [id, o] of remotes) if (o && o.group) out.push({ kind: 'ship', id, x: o.group.x, y: o.group.y, ore: o.callsign });
  // M2i: korsan istasyonu da taranabilir/kilitlenebilir bir nesnedir (yıkmak için T ile kilitle).
  if (state.station) out.push({ kind: 'station', id: state.station.id || 'st1', x: state.station.x, y: state.station.y, ore: t('kind_station') });
  return out;
}
// Kilitli/işaretli nesnenin CANLI konumu (nesne yok olduysa null → kilit düşer).
function objPos(kind, id) {
  if (kind === 'rock') { const r = rocks.get(id); return r && r.g ? { x: r.g.x, y: r.g.y, name: r.ore } : null; }
  if (kind === 'pickup') {
    const p = pickups.get(id); const g = p && (p.group || p.g);
    return g ? { x: g.x, y: g.y, name: p.ore } : null;
  }
  const o = remotes.get(id);
  if (kind === 'station') {
    const st = state.station;
    return st && (st.id || 'st1') === id ? { x: st.x, y: st.y, name: t('kind_station') } : null;
  }
  return o && o.group ? { x: o.group.x, y: o.group.y, name: o.callsign } : null;
}

function submitAnomalyCode() {
  const a = state.anom;
  if (PROBE) { window.__solveTry = ((window.__solveTry || '') + (a ? a.id : 'yok') + ':' + state.anomBuf + ';').slice(-60); }
  if (!a || state.anomBuf.length !== 4) { logLine(t('anom_code_len'), 'warn'); return; }
  send({ t: 'solve_anom', id: a.id, code: Number(state.anomBuf) });
  state.anomInputOpen = false; state.anomBuf = '';
  sfx.ui();
}
// ===========================================================================
// M4a — ANOMALİ: dünya nesnesi (görsel) + frekans kodu girişi (R)
// ===========================================================================
let anomGroup = null, anomGlow = null, anomBody = null, anomKind = null;
// Snapshot/paketlerden gelen anomaliyi ekrana yansıtır. `solved` → nesne KALDIRILIR (yok olur).
function syncAnomaly(a) {
  state.anom = a || null;
  const alive = !!a && !a.solved;
  if (!alive) {
    if (anomGroup) { anomGroup.destroy({ children: true }); anomGroup = null; anomGlow = null; anomBody = null; anomKind = null; }
    if (!a) { state.anomHint = null; state.anomBuf = ''; state.anomInputOpen = false; }
    return;
  }
  if (!anomGroup || anomKind !== a.kind) {
    if (anomGroup) { anomGroup.destroy({ children: true }); anomGroup = null; }
    anomGlow = new PIXI.Graphics();
    anomGlow.circle(0, 0, 26).fill({ color: 0x8f6aff, alpha: 0.10 });
    anomGlow.blendMode = 'add';
    anomBody = pixelSprite(ANOM_ROWS[a.kind] || ANOM_ROWS.RUIN, ANOM_PAL);
    anomGroup = new PIXI.Container();
    anomGroup.addChild(anomGlow, anomBody);
    world.addChild(anomGroup);
    anomKind = a.kind;
  }
  anomGroup.x = a.x; anomGroup.y = a.y;
}
function openAnomalyInput(force) {
  const a = state.anom;
  if (!a || a.solved) { logLine(t('anom_input_none'), 'warn'); return; }
  const d = Math.hypot(a.x - state.me.x, a.y - state.me.y);
  if (d > ANOM_SOLVE_RANGE) { logLine(t('anom_far', { d: Math.round(d) }), 'warn'); sfx.alarm(); return; }
  state.anomInputOpen = force === undefined ? !state.anomInputOpen : !!force;
  state.anomBuf = '';
  sfx.ui();
  if (state.anomInputOpen) {
    logLine(state.anomHint ? t('anom_input_open_hint', { hint: state.anomHint }) : t('anom_input_open'));
  }
}
function doScan() {
  if (state.mapOpen || chatOpen || MENU.open || state.craftOpen) return;
  const now = performance.now();
  if (now < state.scanReadyAt) {
    logLine(t('scan_wait', { sec: Math.ceil((state.scanReadyAt - now) / 1000) }), 'warn');
    return;
  }
  state.scanReadyAt = now + SCAN_COOLDOWN_MS;
  const range = scanRange();
  const n = { rock: 0, pickup: 0, ship: 0 };
  state.scanMarks = [];
  for (const o of roomObjects()) {
    if (Math.hypot(o.x - state.me.x, o.y - state.me.y) > range) continue;
    n[o.kind]++;
    state.scanMarks.push({ kind: o.kind, id: o.id, t0: now });
  }
  state.scan = { t0: now, range };
  sfx.scan();
  // M4a — ANOMALİ TARAMASI: kod istemcide YOK; E basınca sunucudan frekans İPUCU istenir.
  // Kalıntı türünde sunucu "nasıl yağmalanır" bilgisini döner (sessiz kapı bırakmıyoruz).
  if (state.anom && !state.anom.solved) {
    const da = Math.hypot(state.anom.x - state.me.x, state.anom.y - state.me.y);
    if (da <= ANOM_DETECT_RANGE) {
      send({ t: 'scan_anom' });
      logLine(t('anom_detect', { kind: t('kind_' + state.anom.kind), d: Math.round(da) }), 'warn');
    }
  }
  logLine(t('scan_log', { rocks: n.rock, picks: n.pickup, ships: n.ship, range }));
}

function hoverTarget() {
  const a = state.aim;
  if (!a) return null;
  let best = null, bd = HOVER_RADIUS;
  for (const o of roomObjects()) {
    const d = Math.hypot(o.x - a.x, o.y - a.y);
    if (d < bd) { bd = d; best = { kind: o.kind, id: o.id }; }
  }
  return best;
}

function toggleLock() {
  sfx.ensure();
  if (state.lock) { state.lock = null; logLine(t('lock_off')); sfx.ui(); return; }
  const h = hoverTarget();
  if (!h) { logLine(t('lock_none'), 'warn'); sfx.alarm(); return; }
  state.lock = h;
  const p = objPos(h.kind, h.id);
  logLine(t('lock_on', { name: p ? p.name : '?', kind: t('kind_' + h.kind) }));
  sfx.lock();
}

// Her karede: fare altındaki nesneyi bul (kilit adayı) + kilitliyse NİŞANI hedefe yaz.
function updateLock() {
  state.hover = (state.mapOpen || state.craftOpen || chatOpen) ? null : hoverTarget();
  const L = state.lock;
  if (!L) return;
  const p = objPos(L.kind, L.id);
  if (!p) { state.lock = null; logLine(t('lock_lost'), 'warn'); return; }
  state.aim = { x: p.x, y: p.y };   // ← KİLİT: nişan artık fareyi değil HEDEFİ izler
}

// --- ZANAAT PANELİ ---
function toggleCraft(force) {
  state.craftOpen = force === undefined ? !state.craftOpen : !!force;
  if (state.craftOpen) { sfx.ensure(); sfx.ui(); }
}
function craftByIndex(i) {
  const rec = RECIPES[i];

}
function useItem(id, fromPanel) {
  if (PROBE) window.__lastUse = id;      // TEST: hangi yolla gelinirse gelinsin buraya düşer
  // AI'A NOT (M3b): eşya kullanımı panelin İÇİNDEN de olur (envanter satırına tıklama). Panelin
  // açık olması o yolda engel DEĞİLDİR — engel yalnız oyun içi kısayollarda (H/G/J) geçerli,

const craftLayer = new PIXI.Container();
app.stage.addChild(craftLayer);              // harita ve menünün de üstünde (en son eklenen)
const craftG = new PIXI.Graphics();
craftLayer.addChild(craftG);
function mkCraftText(maxW, col) {
  const b = new BitmapText(maxW, 10, col);
  craftLayer.addChild(b.sprite);
  b.sprite.visible = false;
  return b;
}
const cTitle = mkCraftText(200, P.ui);
const cFoot = mkCraftText(420, P.uiDim);
const cRows = RECIPES.map(() => ({
  key: mkCraftText(20, P.engine), name: mkCraftText(150, P.ui),
  cost: mkCraftText(190, P.uiDim), have: mkCraftText(90, P.ui),
}));
const CRAFT = { panel: null, rows: [], invRows: [], colL: 0, colR: 0, colW: 0 };
// M3b: panel artık İKİ SÜTUN — sol ENVANTER (gemideki her şey), sağ ZANAAT (tarifler).
const INV_MAX = 8;                                   // panelde gösterilen en fazla envanter satırı
const invTexts = Array.from({ length: INV_MAX }, () => ({
  name: mkCraftText(150, P.ui), qty: mkCraftText(60, P.ui), key: mkCraftText(30, P.engine),
}));
const mColL = mkCraftText(160, P.uiDim);
const mColR = mkCraftText(160, P.uiDim);
const mEmpty = mkCraftText(220, P.uiDim);

// Gemideki her şey: eşyalar üstte (kullanılabilir olanlar en üstte), sonra cevherler alfabetik.
// Sıfır adetli girdi GÖSTERİLMEZ ("gemideki itemler" isteği = elde olanlar).
function invEntries() {
  const rank = (k) => (USABLE_KEYS[k] ? 0 : (ITEMS[k] ? 1 : 2));
  return Object.entries(state.cargo)
    .filter(([, n]) => n > 0)
    .sort((a, b) => rank(a[0]) - rank(b[0]) || String(a[0]).localeCompare(String(b[0])))
    .slice(0, INV_MAX);
}

function craftLayout() {
  const inv = invEntries();
  // AI'A NOT: Tarif satırları İKİ SATIR (ad + maliyet) ve 26px yüksek. Neden: tek satırda
  // "YAKIT KUTUSU  DOTERYUM 2 TITAN 1" dar pencerede sütuna sığmıyor ve sağdan taşıyordu
  // (ölçülen genişlikle yerleştirmek de kurtarmadı: pencere genişliği VW'ye göre değişiyor).
  // İki satırlık satır HER pencere genişliğinde okunur kalır.
  const invH = inv.length * 16;
  const recH = RECIPES.length * 26;
  const pw = Math.min(600, Math.max(300, VW - 12));
  const ph = 34 + Math.max(invH, recH, 16) + 26;
  const px = Math.round((VW - pw) / 2), py = Math.round((VH - ph) / 2);
  CRAFT.panel = { x: px, y: py, w: pw, h: ph };
  const colW = Math.round((pw - 40) / 2);
  CRAFT.colL = px + 10; CRAFT.colR = px + 20 + colW; CRAFT.colW = colW;
  CRAFT.invRows = inv.map(([id], i) => ({ id, x: CRAFT.colL, y: py + 26 + i * 16 - 1, w: colW, h: 14 }));
  CRAFT.rows = RECIPES.map((r, i) => ({ x: CRAFT.colR, y: py + 25 + i * 26, w: colW, h: 24, i }));
  return { px, py, pw, ph };
}
// Panel açıkken tıklama TÜKETİLİR (ateş etmez); satıra tıklamak üretir, dışına tıklamak kapatır.
function craftHitClick(mx, my) {
  if (!state.craftOpen) return false;
  craftLayout();
  const pan = CRAFT.panel;
  if (!(mx >= pan.x && mx <= pan.x + pan.w && my >= pan.y && my <= pan.y + pan.h)) {
    toggleCraft(false); sfx.ui(); return true;
  }
  for (const r of CRAFT.rows) if (inRect(r, mx, my)) { craftByIndex(r.i); return true; }
  return true;
}
function costText(rec) { return Object.entries(rec.cost).map(([o, n]) => `${o} ${n}`).join(' '); }
function canCraft(rec) { return Object.entries(rec.cost).every(([o, n]) => (state.cargo[o] || 0) >= n); }
function itemName(id) { return t('it_' + String(id).toLowerCase()); }

function drawCraft() {
  const open = state.craftOpen;
  const show = (b, v) => { b.sprite.visible = v; };
  for (const r of cRows) for (const o of [r.key, r.name, r.cost, r.have]) show(o, open);
  for (const tv of invTexts) for (const o of [tv.name, tv.qty, tv.key]) show(o, false);
  show(cTitle, open); show(cFoot, open); show(mColL, open); show(mColR, open); show(mEmpty, open);
  craftG.clear();
  // Tıklama dikdörtgenleri HER karede yeniden kurulur (kargo değişince kaymaz — bkz. Tuzak 46).
  state.invHits = [];
  if (!open) return;
  const { px, py, pw, ph } = craftLayout();
  const pan = CRAFT.panel;
  craftG.rect(pan.x, pan.y, pan.w, pan.h).fill({ color: 0x060b16, alpha: 0.96 });
  craftG.rect(pan.x, pan.y, pan.w, pan.h).stroke({ width: 1, color: P.navyLite });
  craftG.rect(pan.x + 3, pan.y + 3, pan.w - 6, pan.h - 6).stroke({ width: 1, color: 0x12233a });

  cTitle.set(t('craft_title'), P.ui);
  cTitle.sprite.x = px + 12; cTitle.sprite.y = py + 7;
  cFoot.set(t('craft_foot'), P.uiDim);
  cFoot.sprite.x = px + 12; cFoot.sprite.y = py + ph - 18;

  const { colL: lx, colR: rx, colW } = CRAFT;
  craftG.rect(lx, py + 21, pw - 20, 1).fill({ color: 0x12233a });
  craftG.rect(rx - 10, py + 24, 1, ph - 46).fill({ color: 0x12233a });   // sütun ayırıcı
  mColL.set(t('inv_title'), P.uiDim); mColL.sprite.x = lx; mColL.sprite.y = py + 9;
  mColR.set(t('craft_col'), P.uiDim); mColR.sprite.x = rx; mColR.sprite.y = py + 9;

  // ---- SOL SÜTUN: ENVANTER (gemideki her şey) ----
  const inv = invEntries();
  if (!inv.length) {
    mEmpty.set(t('inv_none'), P.uiDim);
    mEmpty.sprite.x = lx + 4; mEmpty.sprite.y = py + 30;
  } else {
    mEmpty.sprite.visible = false;
  }
  inv.forEach(([id, n], i) => {
    const box = CRAFT.invRows[i], tv = invTexts[i];
    const key = USABLE_KEYS[id];
    const usable = !!key;
    craftG.rect(box.x, box.y, box.w, box.h).fill({ color: usable ? 0x0d1a24 : 0x0a1018, alpha: 0.85 });
    craftG.rect(box.x, box.y, box.w, box.h).stroke({ width: 1, color: usable ? 0x2f6fa8 : 0x16283a });
    tv.name.set(ITEMS[id] ? itemName(id) : id, usable ? P.hullLite : P.uiDim);
    tv.name.sprite.x = box.x + 6; tv.name.sprite.y = box.y + 3; show(tv.name, true);
    tv.qty.set('x' + n, P.ui); tv.qty.sprite.x = box.x + box.w - 44; tv.qty.sprite.y = box.y + 3; show(tv.qty, true);
    if (usable) {
      tv.key.set('[' + key + ']', P.engine);
      tv.key.sprite.x = box.x + box.w - 20; tv.key.sprite.y = box.y + 3; show(tv.key, true);
      // KUTUNUN TAMAMI tıklanabilir (yazıya isabet ettirmek zorunda kalmak kötü UX).
      state.invHits.push({ id, x: box.x, y: box.y, w: box.w, h: box.h });
    } else show(tv.key, false);
  });

  // ---- SAĞ SÜTUN: ZANAAT (tarifler) ----
  RECIPES.forEach((rec, i) => {
    const r = cRows[i], box = CRAFT.rows[i];
    const ok = canCraft(rec);
    craftG.rect(box.x, box.y, box.w, box.h).fill({ color: ok ? 0x0d2418 : 0x140d16, alpha: 0.85 });
    craftG.rect(box.x, box.y, box.w, box.h).stroke({ width: 1, color: ok ? 0x2e7d5a : 0x3a2333 });
    r.key.set(`${i + 1}`, ok ? P.engine : P.uiDim);
    r.key.sprite.x = box.x + 4; r.key.sprite.y = box.y + 4;
    r.name.set(itemName(rec.id), ok ? P.ui : P.uiDim);
    r.name.sprite.x = box.x + 16; r.name.sprite.y = box.y + 3;
    // Maliyet ALT SATIRDA (iki satırlık tarif satırı) → hiçbir pencere genişliğinde taşmaz.
    r.cost.set(costText(rec), ok ? P.uiDim : P.warn);
    r.cost.sprite.x = box.x + 16; r.cost.sprite.y = box.y + 13;
    // `have` sütunu KALDIRILDI: üretilecek eşyanın adedi SOL sütunda (envanter) zaten yazıyor.
    r.have.sprite.visible = false;
  });
}

// --- ÇİZİM: TARAMA DALGASI + İŞARETLER + KENAR OKLARI + KİLİT ÇERÇEVESİ ---
function drawScan(now) {
  scanFx.clear(); scanHudFx.clear();
  const beacon = beaconActive();
  // ISARET FISEGI aktifken: menzil SINIRSIZ ve işaretler sürekli yenilenir.
  const marks = beacon
    ? roomObjects().map((o) => ({ kind: o.kind, id: o.id, t0: now }))
    : state.scanMarks;

  if (state.scan) {
    const k = (now - state.scan.t0) / SCAN_WAVE_MS;
    if (k >= 1) state.scan = null;
    else {
      const e = 1 - Math.pow(1 - k, 2);                 // easeOut → dalga yavaşlayarak açılır
      const rad = state.scan.range * e;
      scanFx.circle(state.me.x, state.me.y, rad).stroke({ width: 1, color: 0x5ad0ff, alpha: 0.5 * (1 - k) + 0.2 });
      scanFx.circle(state.me.x, state.me.y, rad * 0.94).stroke({ width: 1, color: 0x2f6fa8, alpha: 0.3 * (1 - k) });
    }
  }
  if (beacon) {
    // Fener alanı: geminin çevresinde nabız atan geniş halka.
    const pulse = 0.4 + 0.4 * Math.sin(now / 240);
    scanFx.circle(state.me.x, state.me.y, scanRange() * 0.5).stroke({ width: 1, color: 0xc9a227, alpha: pulse * 0.5 });
  }

  // İşaretler: dalga nesneye ULAŞTIĞI anda kare belirir, SCAN_MARK_MS boyunca solar. Kayıt ise
  // SCAN_RADAR_MS boyunca TUTULUR (radar hatırlar) — ölü nesneler her iki durumda da düşer.
  const alive = [];
  for (const m of marks) {
    const p = objPos(m.kind, m.id);
    if (!p) continue;
    const age = now - m.t0;
    if (!beacon && age > SCAN_RADAR_MS) continue;
    alive.push(m);
    if (!beacon && age > SCAN_MARK_MS) continue;      // kare süresi bitti → yalnız radar hatırlar
    const a = beacon ? 0.55 : Math.max(0, 1 - age / SCAN_MARK_MS) * 0.85;
    const col = m.kind === 'ship' ? 0xff5a8a : (m.kind === 'pickup' ? 0x8fe0c0 : 0x5ad0ff);
    const rad = m.kind === 'ship' ? 12 : 9;
    scanFx.rect(p.x - rad, p.y - rad, rad * 2, rad * 2).stroke({ width: 1, color: col, alpha: a });
    scanFx.rect(p.x - rad - 2, p.y - rad - 2, rad * 2 + 4, rad * 2 + 4).stroke({ width: 1, color: col, alpha: a * 0.45 });
    // Ekran DIŞINDAKİ işaretler kenarda ok olarak gösterilir ("odada ne varsa görünsün").
    const sx = p.x - state.cam.x + VW / 2, sy = p.y - state.cam.y + VH / 2;
    if (sx < 6 || sx > VW - 6 || sy < 6 || sy > VH - 6) {
      const mx = Math.max(8, Math.min(VW - 8, sx)), my = Math.max(14, Math.min(VH - 14, sy));
      scanHudFx.circle(mx, my, 4).stroke({ width: 1, color: col, alpha: a });
      scanHudFx.circle(mx, my, 1).fill({ color: col, alpha: a });
    }
  }
  if (!beacon) state.scanMarks = alive;
}

function drawLock(now) {
  lockFx.clear();
  const L = state.lock;
  if (!L) { lockText.sprite.visible = false; return; }
  const p = objPos(L.kind, L.id);
  if (!p) { lockText.sprite.visible = false; return; }
  const d = Math.hypot(p.x - state.me.x, p.y - state.me.y);
  const inRange = d <= FIRE_RANGE;
  const blink = 0.6 + 0.4 * Math.sin(now / 180);
  const col = inRange ? 0xffd166 : 0xc05050;
  lockFx.moveTo(state.me.x, state.me.y);
  lockFx.lineTo(p.x, p.y);
  lockFx.stroke({ width: 1, color: col, alpha: 0.18 + blink * 0.2 });
  const rad = L.kind === 'ship' ? 16 : 13;
  for (const [ox, oy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const cx = p.x + ox * rad, cy = p.y + oy * rad;
    lockFx.moveTo(cx, cy); lockFx.lineTo(cx - ox * 6, cy);
    lockFx.moveTo(cx, cy); lockFx.lineTo(cx, cy - oy * 6);
    lockFx.stroke({ width: 1, color: col, alpha: blink });
  }
  lockFx.circle(p.x, p.y, rad + 3).stroke({ width: 1, color: col, alpha: 0.35 * blink });
  // Ekran konumu (kenara kırpılır) → HUD katmanında mesafe yazısı.
  const sx = Math.max(4, Math.min(VW - 4 - lockText.width, p.x - state.cam.x + VW / 2));
  const sy = Math.max(4, Math.min(VH - 16, p.y - state.cam.y + VH / 2 - rad - 12));
  lockText.set(t(inRange ? 'lock_hud' : 'lock_hud_far', { name: p.name, d: Math.round(d) }), col);
  lockText.sprite.x = Math.round(sx); lockText.sprite.y = Math.round(sy);
  lockText.sprite.visible = true;
}

// ===========================================================================
// 13) ANA DÖNGÜ (rAF render / 20Hz ağ)
// ===========================================================================
let mvAccum = 0;
app.ticker.add((ticker) => {
  const dt = Math.min(ticker.deltaMS / 1000, 0.05);  // sekme arkadayken dt patlar → kırp
  lastDt = dt;
  const now = performance.now();
  if (PROBE) window.__tk = (window.__tk || 0) + 1;   // TEST: ticker canlılık sayacı
  if (anomGlow) anomGlow.alpha = 0.06 + 0.06 * Math.sin(now / 650);   // M4a: anomali "nefes alsın"

  // --- 13.1 FİZİK: ivme + sürtünme (uzayda süzülme hissi) ---
  // Hız SHIP_SPEED'i aşmaz: sunucu 220*1.5'te kırpar, aşarsak sürekli geri çekilme olur.
  // AI'A NOT: `!state.mapOpen` — harita açıkken İTİŞ GİRDİSİ KAPALIDIR; o modda WASD/ok tuşları
  // HARİTAYI kaydırır (bkz. 13.9). Aksi halde gemi harita açıkken de hareket ederdi.
  // `state.fuel > 0` — M2b: YAKIT BİTİNCE İTİŞ YOK. Kural sunucuyla AYNI: deponun karşılığı
  // olan mesafe bittiği an itiş kesilir (1 yakıt = 100 birim; kalan bütçe = fuel*100 - accum).
  // Gemi süzülerek durur (mahsur kalmaz: sunucu acil yakıt damlası verir + DOTERYUM dolumu var).
  // M2h: SHIFT BOOST — hız tavanı ve yakıt eşiği shift'e göre değişir. Sunucu AYNI çarpanları
  // uygular (sn paketinden gelir); yakıt bütçesi yoksa boost işe yaramaz (itme kapalı zaten).
  // DİKKAT: sıra ÖNEMLİ — `fuelBudget` `perFuel`e, `state.boosting` de `fuelBudget`a bağlı
  // (ters sırada yazılırsa TDZ hatası verir; bir kez yaşandı).
  const shiftHeld = !!(keys.ShiftLeft || keys.ShiftRight) && !state.mapOpen && !chatOpen;
  const perFuel = shiftHeld ? FUEL_PER_DISTANCE / BOOST_FUEL_MUL : FUEL_PER_DISTANCE;
  const fuelBudget = state.fuel * perFuel - (state.fuelAccum || 0);
  state.boosting = shiftHeld && fuelBudget > 0;
  const speedCap = SHIP_SPEED * (state.boosting ? BOOST_MUL : 1);
  if (!chatOpen && !state.mapOpen && fuelBudget > 0) {
    let ix = 0, iy = 0;
    if (keys.KeyW || keys.ArrowUp) iy -= 1;
    if (keys.KeyS || keys.ArrowDown) iy += 1;
    if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (ix || iy) {
      const l = Math.hypot(ix, iy);
      state.me.vx += ix / l * ACCEL * dt;
      state.me.vy += iy / l * ACCEL * dt;
    }
  }
  const damp = Math.exp(-DRAG * dt);   // frame-rate bağımsız sürtünme
  state.me.vx *= damp; state.me.vy *= damp;
  const sp = Math.hypot(state.me.vx, state.me.vy);
  if (sp > speedCap) { const k = speedCap / sp; state.me.vx *= k; state.me.vy *= k; }
  state.me.x += state.me.vx * dt;
  state.me.y += state.me.vy * dt;

  // --- 13.1b YAKIT: yerel tahmin (HUD akıcı) + motor sesi ---
  // AI'A NOT: Kat edilen mesafe başına tüketim — sunucudaki kuralın AYNISI. Sunucu tam sayı
  // değişiminde 'fuel' paketi yollar ve bu tahmini tam doğruya çeker (hata birikmez).
  // Bütçe: `fuel*100 - accum`; tükendiğinde itiş durur (yukarıdaki kapı da aynı formülü kullanır).
  state.fuelAccum = (state.fuelAccum || 0) + sp * dt;
  while (state.fuelAccum >= perFuel && state.fuel > 0) {
    state.fuelAccum -= perFuel; state.fuel -= 1;
  }
  if (state.fuel <= 0) {
    state.fuel = 0;
    if (!state.fuelWarned) { state.fuelWarned = true; logLine(t('fuel_empty_warn'), 'warn'); sfx.alarm(); }
  } else if (state.fuel > 6) {
    state.fuelWarned = false;   // yakıt geldi → uyarı yeniden kurulur
  }
  sfx.engine(!state.mapOpen && fuelBudget > 0 ? Math.min(1, sp / SHIP_SPEED) : 0);

  // --- 13.2 SUNUCU YAKINSAMASI: büyük sapmada düzelt, küçükte dokunma (titreme olmasın) ---
  const dxs = state.serverPos.x - state.me.x, dys = state.serverPos.y - state.me.y;
  const ds = Math.hypot(dxs, dys);
  if (ds > 60) { state.me.x = state.serverPos.x; state.me.y = state.serverPos.y; state.me.vx = state.me.vy = 0; }
  else if (ds > 4) { state.me.x += dxs * 0.12; state.me.y += dys * 0.12; }
  if (sp > 6) state.me.r = Math.atan2(state.me.vy, state.me.vx) + Math.PI / 2;

  // --- 13.3 KAMERA: yumuşak takip + hıza göre ileri bakış ---
  state.cam.x += (state.me.x + state.me.vx * 0.35 - state.cam.x) * Math.min(1, dt * 4);
  state.cam.y += (state.me.y + state.me.vy * 0.35 - state.cam.y) * Math.min(1, dt * 4);
  // AI'A NOT: Math.round ŞART — kesirli kaydırma pikselleri yarım piksele düşürür, bulanıklaştırır.
  world.position.set(Math.round(VW / 2 - state.cam.x), Math.round(VH / 2 - state.cam.y));

  // --- 13.4 ARKA PLAN PARALLAX ---
  SCROLL = Math.min(1, SCROLL + dt * 8);
  for (const c of nebulaLayers) {
    c.position.set(-state.cam.x * c._parallax, -state.cam.y * c._parallax);
    c.alpha = SCROLL;
  }
  for (const s of starLayers) {
    s.position.set(-state.cam.x * s._parallax, -state.cam.y * s._parallax);
    s.alpha = SCROLL;
  }
  for (const tw of twinklers) {
    tw._phase += dt * tw._speed;
    tw.alpha = (0.45 + Math.sin(tw._phase) * 0.45) * SCROLL;
    tw.position.set(tw._px - state.cam.x * 0.8, tw._py - state.cam.y * 0.8);
  }

  // --- 13.5 KENDİ GEMİMİZ + motor nabzı ---
  meGroup.position.set(Math.round(state.me.x), Math.round(state.me.y));
  meGroup.rotation = state.me.r;
  const thrust = Math.min(1, sp / SHIP_SPEED);
  myGlow.alpha = 0.10 + thrust * 0.5;
  myGlow.scale.set(1 + thrust * 0.6 + Math.sin(now / 90) * 0.05, 1 + thrust * 1.4);
  myGlow.tint = thrust > 0.05 ? 0xffc46b : 0x88ccff;

  // --- 13.6 UZAK GEMİLER: lerp (sunucu 10Hz, ekran 60Hz → doğrudan atlama takılma yapar) ---
  for (const [, o] of remotes) {
    o.group.x += (o.tx - o.group.x) * Math.min(1, dt * 10);
    o.group.y += (o.ty - o.group.y) * Math.min(1, dt * 10);
    o.group.rotation += (o.tr - o.group.rotation) * Math.min(1, dt * 10);
  }

  // --- 13.7 SİSTEM YILDIZI nabzı ---
  if (starGroup._halo) {
    starGroup._phase += dt;
    starGroup._halo.scale.set(1 + Math.sin(starGroup._phase * 0.8) * 0.03);
  }

  // --- 13.8b M2: ATEŞ + EFEKT ÇİZİMİ ---
  // AI'A NOT: M2h KİLİT — nişan güncellemesi ATEŞTEN ÖNCE olmalı: kilitliyse `state.aim` bu karede
  // hedefe yazılır ve atış tam ona gider (fareyi dinlemez).
  updateLock();
  if (keys.Space) tryFire(now);
  drawFx(now);
  // M2e: kapsül nabzı + tractor hedefi halkası (birkaç kapsül → ucuz) ve fare nişangâhı.
  for (const [id, pk] of pickups) {
    pk.glow.alpha = 0.5 + 0.5 * Math.sin(now / 300 + pk.phase);
    pk.ring.visible = (id === state.tractorTarget);
  }
  drawAim();

  // --- 13.8 20Hz AĞ GÖNDERİMİ ---
  frames++;
  mvAccum += dt;
  if (mvAccum >= 1 / MV_HZ) {
    mvAccum = 0;
    send({ t: 'mv', x: Math.round(state.me.x), y: Math.round(state.me.y), r: Number(state.me.r.toFixed(2)), boost: state.boosting ? 1 : 0 });
  }

  // --- 13.9b UZAK PING: seyrek, rastgele aralıklı tek sinyal (gizemli atmosfer) ---
  // AI'A NOT: Rastgele aralık ŞART; sabit periyot "alarm" gibi algılanır. 18-52 sn arası,
  // ses kapalıyken hiç çalışmaz. Aynı anda ekranda bir fısıltı da tetiklenir.
  if (now > nextPingAt) {
    nextPingAt = now + 18000 + Math.random() * 34000;
    if (!state.muted) sfx.ping();
  }

  // --- 13.9 HARİTA MODU: PAN + SEÇİM (imleç YOK) ---
  // AI'A NOT: Harita açıkken İTİŞ KAPALIDIR (bkz. 13.1) → WASD/ok tuşları HARİTAYI KAYDIRIR.
  // Tüm yıldız alanı kayar, merkezdeki yıldız seçilidir. Yeniden çizim 45ms'de bir yapılır:
  // her kare 16384 yıldızı taramak gereksiz CPU olurdu, ama 45ms (≈22Hz) akıcı görünür.
  if (state.mapOpen && starmap) {
    let px = 0, py = 0;
    if (keys.KeyA || keys.ArrowLeft) px -= 1;
    if (keys.KeyD || keys.ArrowRight) px += 1;
    if (keys.KeyW || keys.ArrowUp) py -= 1;
    if (keys.KeyS || keys.ArrowDown) py += 1;
    if (px || py) {
      const l = Math.hypot(px, py);
      state.mapView.x += (px / l) * MAP_PAN_SPEED * dt;
      state.mapView.y += (py / l) * MAP_PAN_SPEED * dt;
      if (now - lastMapBuildAt > MAP_PAN_REBUILD_MS) { lastMapBuildAt = now; buildMap(); }
    }
    if (mapSelRing) mapSelRing.alpha = 0.45 + Math.sin(now / 260) * 0.35;
    if (mapStarRing) mapStarRing.alpha = 0.5 + Math.sin(now / 420) * 0.3;
  }

  // --- 13.10 GİZEMLİ FISILTILAR: 35-70 sn arası, oyuncuyu yalnız hissettirir ---
  if (now - state.lastWhisper > 35000 + Math.random() * 35000) {
    state.lastWhisper = now;
    if (!state.star || !state.star.a) whisper(pick([
      t('w_metal'), t('w_sensor'), t('w_hull'), t('w_someone'), t('w_stars'),
    ]));
  }

  drawMenu();          // M2g: menü + MENU düğmesi (HUD'ın üstünde ama ayrı katmanda)
  drawScan(now);       // M2h: tarama dalgası + işaretler
  drawNpcBars();       // M2i: korsan/istasyon hasar çubukları + kenar okları
  drawLock(now);       // M2h: kilit çerçevesi + mesafe yazısı
  drawCraft();         // M2h: zanaat paneli (harita/menü ile aynı katman mantığı)
  drawHud(now);
  if (PROBE) window.__tkEnd = (window.__tkEnd || 0) + 1;   // TEST: ticker SONUNA ulaştı mı
});

// ===========================================================================
// 14) HUD ÇİZİMİ (her kare; BitmapText sadece içerik değişince yeniden çizer)
// ===========================================================================
// M4a — ANOMALİ FREKANS GİRİŞ KUTUSU (R): ipucu + girilen haneler + mesafe. Yalnız giriş açıkken
// görünür (HUD'ı sürekli kalabalıklaştırmaz). `put` ile metin/renk değişmediyse yeniden çizilmez.
const anomText = new BitmapText(340, 10, P.ui);
hudLayer.addChild(anomText.sprite);
anomText.sprite.visible = false;
anomText.sprite.x = 8; anomText.sprite.y = 100;
function drawHud(now) {
  // M4a: frekans kodu girişi — sunucu kapısı 450 birim; burada yalnız GÖSTERİM yapılır.
  // AI'A NOT: BitmapText API'si `.set(metin, renk)` + `.sprite.x/y`; menüdeki `put()` yerel bir
  // yardımcı ve burada YOK (ilk sürüm `put` çağırdı → Uncaught ReferenceError: put is not defined,
  // HUD her kare çöktü). Tarayıcıda ölçülerek bulundu; Node testi bunu göremez.
  const an = state.anom;
  const showAnom = state.anomInputOpen && an && !an.solved;
  anomText.sprite.visible = !!showAnom;
  if (showAnom) {
    const shown = (state.anomBuf + '____').slice(0, 4).split('').join(' ');
    const d = Math.round(Math.hypot(an.x - state.me.x, an.y - state.me.y));
    anomText.set(`${t('anom_input_title')} ${state.anomHint || '? ? ? ?'}  >  ${shown}   d=${d}`, P.ui);
  }
  const st = state.star;
  topText.set(t('hud', {
    star: st ? st.n : '...', cls: st ? st.k : '?',
    shield: Math.round(state.shield), hull: Math.round(state.hull),
    fuel: Math.round(state.fuel), max: FUEL_TANK,
    contacts: remotes.size, rocks: rocks.size, ping,
  }));
  // M2i (KULLANICI İSTEĞİ): "tuşlar ekranda hep değil, menüde" → sürekli ipucu satırı KALDIRILDI.
  // hintText yalnız harita açıkken (hint_map) görünür; oyun içinde HUD temiz kalır.
  if (state.mapOpen) { hintText.set(t('hint_map')); hintText.sprite.visible = true; }
  else hintText.sprite.visible = false;

  // M3b (KULLANICI İSTEĞİ): "oyun ekranda yazmasına gerek yok sadece warp cell yazsın"
  // → HUD'daki eşya/cevher listesi ve TIKLAMA çipleri KALDIRILDI. Tüm envanter + zanaat tek
  // panelde (C). HUD'da yalnız WARP HUCRESI sayısı + durum etiketleri kalır.
  // AI'A NOT: `state.invHits` BURADA sıfırlanmaz — çizim sırası drawCraft → drawHud olduğu için
  // burada sıfırlamak panelin tıklama kutularını SİLERDİ. Kutuları yalnız drawCraft yönetir.
  const cooling = now - state.lastFireAt < FIRE_COOLDOWN_MS;
  cargoText.set(
    t('inv_warp_only', { n: state.cargo[ITEMS.WARPCELL] || 0 })
    + (state.tractorOn ? ' · ' + t('ui_tractor') : '')
    + (state.boosting ? ' · ' + t('ui_boost') : '')
    + (cooling ? ' · ' + t('ui_cooling') : '')
    // M2e: dolum geri bildirimi (yalnız yıldızın dibinde çalışır) + yakıt uyarıları
    + (state.refueling ? ' · ' + t('ui_refuelling') : '')
    // M3d: kalkan (gemi enerjisi) durumu — hasar aldıktan sonra gecikmeyle KENDİLİĞİNDEN dolar
    + (state.shield < 99.5
      ? (now - state.lastHitAt < SHIELD_REGEN_DELAY_MS
        ? ' · ' + t('ui_shield_wait') : ' · ' + t('ui_shield_regen'))
      : '')
    + (state.fuel <= 0 ? ' · ' + t('ui_fuel_empty') : (state.fuel < 5 ? ' · ' + t('ui_fuel_low') : ''))
    + (Math.hypot(state.me.x, state.me.y) <= REFUEL_RANGE && state.fuel < FUEL_TANK - 0.5
      ? ' · ' + t('ui_refuel_hint') : '')
  );

  bars.clear();
  bars.rect(-1, -1, 84, 14).fill({ color: 0x0a1018, alpha: 0.7 });
  bars.rect(0, 0, 82, 3).fill(0x1a2a3a);
  bars.rect(0, 0, Math.round(82 * state.shield / 100), 3).fill(P.cockpit);
  bars.rect(0, 5, 82, 3).fill(0x2a2016);
  bars.rect(0, 5, Math.round(82 * state.hull / 100), 3).fill(P.engine);
  // M2b YAKIT çubuğu — dolu/az/bitik renkleri tek bakışta okunur.
  const fk = Math.max(0, Math.min(1, state.fuel / FUEL_TANK));
  bars.rect(0, 10, 82, 3).fill(0x16202a);
  bars.rect(0, 10, Math.round(82 * fk), 3).fill(fk > 0.35 ? 0x8fe0c0 : (fk > 0 ? 0xd8b45a : 0xc05050));

  logText.set(state.log.slice(-6).map(l => (l.kind === 'chat' ? '  ' : '> ') + l.text).join('\n'));

  const w = state.whispers[state.whispers.length - 1];
  if (w) {
    const age = now - w.ts;
    whisperText.sprite.alpha = age < 6000 ? Math.min(0.9, (6000 - age) / 2500) : 0;
    whisperText.set(w.strong ? `[ ${w.text} ]` : w.text, w.strong ? 0xc8a8ff : P.ghost);
    // AI'A NOT: Ortalama ÖLÇÜLEN genişlikle — tuval genişliğiyle değil (bkz. BitmapText.width).
    whisperText.sprite.x = Math.round((VW - whisperText.width) / 2);
  }

  // --- Mini radar (sağ üst): 1600 birim yarıçap; kaya/gemi/kapsül/yıldız göreli konumda ---
  // AI'A NOT: KULLANICI İSTEĞİ — "minimap iki kat büyüt" → R 62 → 124 (aynı 1600 birimlik saha,
  // iki kat büyük gösterim). Nokta boyutları da ölçeklendi ki okunaklı kalsın.
  // AI'A NOT (M2h — KULLANICI İSTEĞİ): "scan yapmadan minimapde SADECE YILDIZ görünsün, diğer
  // şeyler görünmesin". Radar artık bir SİS perdesi: kaya/kapsül/gemi yalnız TARANMIŞSA (canlı
  // işaret) görünür; ISARET FISEGI açıkken 30 sn boyunca her şey görünür. Gemi ve sistem yıldızı
  // her zaman görünür (kendi konumun ve sistemin pusulası hep lazım). Tarama dalgası + kenar
  // noktaları zaten "nerede ne var" bilgisini verir → sis, tarama tuşunu anlamlı kılar.
  const revealed = new Set();
  if (beaconActive()) for (const o of roomObjects()) revealed.add(o.kind + '/' + o.id);
  else for (const m of state.scanMarks) revealed.add(m.kind + '/' + m.id);
  radar.clear();
  const R = 124, rx = VW - R - 8, ry = 6;
  radar.rect(rx - 1, ry - 1, R + 2, R + 2).fill({ color: 0x050a10, alpha: 0.78 });
  radar.rect(rx, ry, R, R).stroke({ width: 1, color: revealed.size ? 0x1d3a4a : 0x14222c });
  const k = (R / 2) / 1600, ccx = rx + R / 2, ccy = ry + R / 2;
  for (const [id, r] of rocks) {
    if (!revealed.has('rock/' + id)) continue;         // M2h: taranmamış → radarda YOK
    const px = ccx + (r.g.x - state.me.x) * k, py = ccy + (r.g.y - state.me.y) * k;
    if (px < rx || px > rx + R || py < ry || py > ry + R) continue;
    radar.rect(Math.round(px), Math.round(py), 2, 2).fill(P.rockHi);
  }
  for (const [id, pk] of pickups) {          // M2e: düşen kapsüller (cevher renginde, 2x2)
    if (!revealed.has('pickup/' + id)) continue;       // M2h: taranmamış → radarda YOK
    const px = ccx + (pk.group.x - state.me.x) * k, py = ccy + (pk.group.y - state.me.y) * k;
    if (px < rx || px > rx + R || py < ry || py > ry + R) continue;
    radar.rect(Math.round(px), Math.round(py), 2, 2).fill(P.ore[pk.ore] || 0xffffff);
  }
  for (const [id, o] of remotes) {
    if (!revealed.has('ship/' + id)) continue;         // M2h: taranmamış → radarda YOK
    const px = ccx + (o.group.x - state.me.x) * k, py = ccy + (o.group.y - state.me.y) * k;
    if (px < rx || px > rx + R || py < ry || py > ry + R) continue;
    // M2i: korsanlar radarda KIRMIZI (düşman olduğu bir bakışta belli olsun).
    radar.rect(Math.round(px), Math.round(py), 3, 3).fill(o.pirate ? P.bad : P.warn);
  }
  // M2i: korsan istasyonu (taranmışsa) — 5x5 turuncu blok: büyük hedef, uzaktan görünür.
  if (state.station && revealed.has('station/' + (state.station.id || 'st1'))) {
    const px = ccx + (state.station.x - state.me.x) * k, py = ccy + (state.station.y - state.me.y) * k;
    if (px >= rx && px <= rx + R && py >= ry && py <= ry + R) {
      radar.rect(Math.round(px) - 2, Math.round(py) - 2, 5, 5).fill(P.warn);
    }
  }
  radar.rect(Math.round(ccx) - 2, Math.round(ccy) - 2, 4, 4).fill(P.navyLite);   // biz
  const sx = ccx + (0 - state.me.x) * k, sy = ccy + (0 - state.me.y) * k;         // sistem yıldızı
  if (sx > rx && sx < rx + R && sy > ry && sy < ry + R) radar.circle(sx, sy, 3).fill(P.engine);
  // Sisin açık olduğunu SÖYLE (yoksa "radar bozuk" sanılır).
  if (radarNote) {
    radarNote.sprite.visible = revealed.size === 0 && !beaconActive();
    if (radarNote.sprite.visible) {
      radarNote.set(t('radar_unscanned'), P.uiDim);
      radarNote.sprite.x = Math.round(rx + (R - radarNote.width) / 2);
      radarNote.sprite.y = ry + R + 3;
    }
  }
}
