# AI'A NOT: Tek komutluk üretim kurulumu: `docker compose -f deploy/docker-compose.yml up -d --build`
#
# NEDEN CADDY: TLS + `wss://` sonlandırması. Caddy sertifikayı otomatik alır/yeniler (domain
# gösterilmişse) — ayrıca elle certbot/tarih takibi yok. Caddy TÜM trafiği (HTML + WebSocket)
# oyun sunucusuna proxy'ler, yani istemci `location.host`'a bağlanınca doğru yere düşer.
#
# NEDEN admin portu PUBLISH EDİLMİYOR: `ports:` altında 8090 YOK → port yalnız container ağında
# kalır, dışarıdan erişilemez. Yönetici erişimi SSH tüneliyle:
#   ssh -L 8090:127.0.0.1:8090 kullanici@sunucu     → sonra tarayıcı: http://localhost:8090
services:
  game:
    build:
      context: ..
      # Tek gerçek Dockerfile repo KÖKÜNDE (platformlar da onu arar) → drift yok.
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      PORT_GAME: "8081"
      PORT_ADMIN: "8090"
      ADMIN_BIND: "127.0.0.1"
    expose:
      - "8081"
    # ports: YOK — dışarıya doğrudan açılmıyor; trafik Caddy'den geçer.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domain varsa: SITE_ADDRESS=oyun.example.com  |  Domain YOKSA: SITE_ADDRESS=:80 (yalnız http)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - game

volumes:
  caddy_data:
  caddy_config:
